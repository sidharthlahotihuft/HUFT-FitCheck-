function SalesBadge({b}){
  const [hov,setHov]=useState(false);
  const sv = b && typeof SALES!=="undefined" ? SALES[b.name] : null;
  if(!sv) return null;
  const ok=sv.ok;
  const bg=ok?"#E5F9F0":"#EAECF2", col=ok?"#00854D":"#9699A6", bd=ok?"#00854D":"#C3C6D4";
  const label=ok?"✓ Sales-verified":"No sales data";
  return (
    <span style={{position:"relative",display:"inline-flex"}} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} onClick={e=>{e.stopPropagation();setHov(h=>!h);}}>
      <span style={{...MONO,fontSize:9.5,fontWeight:700,padding:"2px 8px",borderRadius:999,background:bg,color:col,border:`1px solid ${bd}66`,cursor:"help",whiteSpace:"nowrap"}}>{label}</span>
      {hov && (
        // Offset well past the breed's own neck/chest subtitle line directly below

        <span style={{position:"absolute",top:"calc(100% + 30px)",left:0,width:250,background:"#fff",border:"1px solid #E6E9EF",borderRadius:8,boxShadow:"0 8px 28px rgba(50,51,56,0.22)",padding:"10px 11px",zIndex:60,textAlign:"left",whiteSpace:"normal",cursor:"default",fontFamily:"'Rubik',sans-serif"}}>

function Chip({text,tip,tone}){ const t = tone==="warn"?{bg:"#FEF1E5",fg:"#BA4511",bd:"#FFBE92"}:{bg:"#F0F1F6",fg:"#565A6E",bd:"#C3C6D4"};
  return <span title={tip} style={{fontSize:10.5,padding:"2px 7px",borderRadius:999,background:t.bg,color:t.fg,border:`1px solid ${t.bd}`,whiteSpace:"nowrap"}}>{text}</span>; }
function Meter({label,val,color}){ return (
  <div style={{flex:1,minWidth:86}}>
    <div style={{fontSize:10,color:"#9699A6",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:3}}>{label} <b style={{color:"#323338"}}>{val}/5</b></div>
    <div style={{display:"flex",gap:2}}>{[1,2,3,4,5].map(i=><div key={i} style={{flex:1,height:6,borderRadius:3,background:i<=val?(color||"#FF6D1F"):"#E6E9EF"}}/>)}</div>
  </div>); }
function TapeBar({breedRange,prodRange,domain}){
  const [dLo,dHi]=domain, span=dHi-dLo, pct=v=>Math.max(0,Math.min(100,((v-dLo)/span)*100));
  const bLo=pct(breedRange[0]),bHi=pct(breedRange[1]),pLo=pct(prodRange[0]),pHi=pct(prodRange[1]);
  const oLo=Math.max(bLo,pLo),oHi=Math.min(bHi,pHi);
  const hasOverlap=oHi>oLo;
  return (
    <div>
      <div style={{position:"relative",height:24,borderRadius:6,background:"#F0F1F6",border:"1px solid #E6E9EF"}}>
        {/* tick marks every ~10% */}
        <div style={{position:"absolute",inset:0,display:"flex"}}>
          {Array.from({length:9}).map((_,i)=><div key={i} style={{flex:1,borderRight:i<8?"1px solid #E6E9EF":"none"}}/>)}
        </div>
        {/* breed range band */}
        <div style={{position:"absolute",top:2,bottom:2,left:bLo+"%",width:Math.max(0.6,bHi-bLo)+"%",background:"#E6E9F5",border:"1.5px dashed #9699A6",borderRadius:4,boxSizing:"border-box"}}/>
        {/* product range bar */}
        <div style={{position:"absolute",top:7,bottom:7,left:pLo+"%",width:Math.max(0.8,pHi-pLo)+"%",background:"#FFC299",borderRadius:3}}/>
        {/* overlap */}
        {hasOverlap && <div style={{position:"absolute",top:7,bottom:7,left:oLo+"%",width:(oHi-oLo)+"%",background:"#00A25B",borderRadius:3}}/>}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:"#9699A6",marginTop:2,fontFamily:"'IBM Plex Mono', ui-monospace, monospace"}}>
        <span>{dLo} cm</span><span>{dHi} cm</span>
      </div>
    </div>
  ); }
function NumBox({label,value,onChange,min=10,max=130}){ return (
  <label style={{display:"flex",flexDirection:"column",gap:4,flex:1,minWidth:90}}>
    <span style={{fontSize:11,letterSpacing:"0.06em",textTransform:"uppercase",color:"#676879",fontWeight:600}}>{label}</span>
    <input type="number" inputMode="decimal" value={value} min={min} max={max} step="0.5"

/* ---------- feedback form per breed ---------- */
function FeedbackBox({breed,feedback,onAdd}){
  const [open,setOpen]=useState(false);
  const [verdict,setVerdict]=useState("good");
  const [field,setField]=useState("overall");
  const [text,setText]=useState("");
  const [author,setAuthor]=useState(store.get("huft_fit_author",""));
  const mine = feedback.filter(f=>f.breed===breed.name);
  const submit=()=>{
    if(!text.trim() && verdict==="bad"){ return; }
    store.set("huft_fit_author",author);
    onAdd({id:Date.now(),breed:breed.name,verdict,field,text:text.trim(),author:author.trim()||"anonymous",ts:new Date().toISOString()});
    setText(""); setOpen(false);
  };
  return (
    <div style={{marginTop:10,borderTop:"1px dashed #E6E9EF",paddingTop:8}}>

          {open?"Close":"Rate this data"} {mine.length>0 && <span style={{color:"#FF6D1F"}}>· {mine.length} note{mine.length>1?"s":""}</span>}

          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>

              <button key={v} onClick={()=>setVerdict(v)} style={{padding:"5px 12px",borderRadius:999,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",
                border:verdict===v?"1.5px solid #323338":"1.5px solid #E6E9EF",background:verdict===v?(v==="good"?"#E5F9F0":"#FCE9EC"):"#fff",color:verdict===v?(v==="good"?"#00A25B":"#E2445C"):"#676879"}}>{l}</button>

            rows={2} style={{width:"100%",boxSizing:"border-box",borderRadius:7,border:"1px solid #C3C6D4",padding:8,fontSize:13,fontFamily:"inherit",resize:"vertical"}}/>
          <div style={{display:"flex",gap:8,marginTop:6,flexWrap:"wrap"}}>

            <button onClick={submit} style={{background:"#FF6D1F",color:"#fff",border:"none",borderRadius:7,padding:"6px 16px",fontSize:12.5,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Submit</button>
          </div>
        </div>

/* ---------- Ask HUFT Fit: rule-based answer engine over the data ---------- */
const CITY_ZONE = {delhi:"n",gurgaon:"n",gurugram:"n",noida:"n",ncr:"n",jaipur:"n",lucknow:"n",chandigarh:"n","tri-city":"n",north:"n",
  mumbai:"w",pune:"w",ahmedabad:"w",surat:"w",gujarat:"w",west:"w",
  bangalore:"s",bengaluru:"s",chennai:"s",hyderabad:"s",kochi:"s",south:"s",
  kolkata:"e",guwahati:"e",east:"e"};
const ALIASES = {lab:"Labrador Retriever",labrador:"Labrador Retriever",golden:"Golden Retriever",gsd:"German Shepherd","german shepherd":"German Shepherd",alsatian:"German Shepherd",
  indie:"Indian Pariah (Indie)",pariah:"Indian Pariah (Indie)","desi dog":"Indian Pariah (Indie)",pom:"Pomeranian",frenchie:"French Bulldog",
  "shih tzu":"Shih Tzu",shihtzu:"Shih Tzu",husky:"Siberian Husky",rott:"Rottweiler",rottweiler:"Rottweiler",doberman:"Doberman",dobermann:"Doberman",
  mudhol:"Mudhol / Caravan Hound",caravan:"Mudhol / Caravan Hound",dane:"Great Dane",saint:"Saint Bernard","st bernard":"Saint Bernard",
  pitbull:"Amstaff / Pit-type","pit bull":"Amstaff / Pit-type",amstaff:"Amstaff / Pit-type",gaddi:"Himalayan Sheepdog (Gaddi)","bully kutta":"Bully Kutta (Indian Mastiff)",
  dachshund:"Dachshund (Standard)",sausage:"Dachshund (Standard)",corgi:"Pembroke Corgi",bulldog:"English Bulldog",spitz:"Indian Spitz",poodle:"Standard Poodle",
  malamute:"Alaskan Malamute",basset:"Basset Hound","tibetan mastiff":"Tibetan Mastiff",bullmastiff:"Bullmastiff",banjara:"Banjara Hound",vanjari:"Banjara Hound"};

function findBreeds(q, all){
  const found=[]; const ql=" "+q.toLowerCase()+" ";
  const entries=Object.entries(ALIASES).sort((a,z)=>z[0].length-a[0].length);
  for(const [alias,full] of entries){ if(ql.includes(alias)){ const b=all.find(x=>x.name===full); if(b && !found.includes(b)) found.push(b); } }
  for(const b of all){ const parts=[b.name.toLowerCase(),b.name.toLowerCase().split(" (")[0],b.name.toLowerCase().split(" /")[0]];
    if(parts.some(p=>p.length>3 && ql.includes(p)) && !found.includes(b)) found.push(b); }
  return found.slice(0,2);
}
const confNote = t => t==="A"?"confidence A, ±2–3 cm":t==="B"?"confidence B, ±4–6 cm":"confidence C — estimate, validate in fit lab";

/* ---------- product ↔ breed fit engine ---------- */
function bestVariantForBreed(sku, b){
  // apparel is sized by garment back-length, not neck/chest girth
  if(sku.type==="apparel"){
    const bodyLen = (b.care && b.care.bodyLen) || b.height;
    let best=null;
    sku.variants.forEach(v=>{
      const lOv = overlapPct(bodyLen,[v.lengthMin,v.lengthMax]);
      if(!best || lOv>best.score) best={variant:v,score:lOv,cOv:lOv,nOv:1};
    });
    return best;
  }
  // score each variant by combined neck+chest overlap; return best
  let best=null;
  sku.variants.forEach(v=>{
    const nOv = v.neckMin!=null ? overlapPct(b.neck,[v.neckMin,v.neckMax]) : 1;
    const cOv = overlapPct(b.chest,[v.chestMin,v.chestMax]);
    const wOv = (v.weightMin!=null) ? overlapPct(b.weight,[v.weightMin,v.weightMax]) : 1;
    const score = Math.min(cOv, nOv)*0.7 + wOv*0.3;
    if(!best || score>best.score) best={variant:v,score,cOv,nOv};
  });
  return best;
}
// Best-fitting catalog size of a specific product for one breed (used in "By product" mode).
function bestSizeForBreed(product, b, ptype){
  if(!product || !product.variants || !product.variants.length) return null;
  const bodyLen=(b.care&&b.care.bodyLen)||b.height;
  const fmtR=r=>!r?"":(Math.round(r[0])===Math.round(r[1])?`${Math.round(r[0])} cm`:`${Math.round(r[0])}–${Math.round(r[1])} cm`);
  let best=null;
  product.variants.forEach(v=>{
    const d=dimsOfVariant(product,v);
    let score,cm,m;
    if(ptype==="apparel"){ if(!d.length) return; score=overlapPct(bodyLen,d.length); cm=fmtR(d.length); m="back"; }
    else if(ptype==="harness"){ if(!d.chest) return; const n=d.neck?overlapPct(b.neck,d.neck):1; score=Math.min(n,overlapPct(b.chest,d.chest)); cm=fmtR(d.chest); m="girth"; }
    else { if(!d.neck) return; score=overlapPct(b.neck,d.neck); cm=fmtR(d.neck); m="neck"; }
    if(best===null||score>best.score) best={size:v.size,score,cm,m};
  });
  return best && best.score>0 ? best : null;
}
// Raincoat models carry full back/girth/neck per size from the PPT decks; match a product name to its model.
function raincoatModelFor(name){
  if(!name || typeof RAINCOAT_MODELS==="undefined") return null;
  const n=name.toLowerCase();
  for(const kv of RAINCOAT_MATCH){ if(n.includes(kv[0])) return Object.assign({name:kv[1]}, RAINCOAT_MODELS[kv[1]]); }
  return null;
}
function nearestIdx(arr,t){ let bi=0,bd=Infinity; arr.forEach((v,i)=>{const d=Math.abs(v-t); if(d<bd){bd=d;bi=i;}}); return bi; }
// The single best size of a raincoat model for this breed (matched on back length + coverage ease).
function recSizesRaincoat(model,b){
  const bl=(b.care&&b.care.bodyLen)||b.height; const E=8; const mid=(bl[0]+bl[1])/2;
  const i=nearestIdx(model.back, mid+E); const s={}; s[model.sizes[i]]=true; return s;
}
// ptype from a catalog subCategory, for fit maths on non-raincoat products.
function ptypeOfSub(sub){ if(!sub) return "apparel"; const s=sub.toLowerCase();
  if(s.includes("harness")) return "harness"; if(s.includes("collar")||s.includes("leash")) return "collar"; return "apparel"; }
// Build a per-size dimension chart for any catalog product from its parsed variant dims.
function productChart(product){
  const labels=[], seen={};
  (product.variants||[]).forEach(v=>(v.dimParsed||[]).forEach(d=>{ if(!seen[d.label]){seen[d.label]=1; labels.push(d.label);} }));
  const sizes=(product.variants||[]).map(v=>v.size), data={};
  (product.variants||[]).forEach(v=>{ const row={}; (v.dimParsed||[]).forEach(d=>{ row[d.label]= (d.value===d.valueMax?`${d.value}`:`${d.value}–${d.valueMax}`)+(d.unit?` ${d.unit}`:""); }); data[v.size]=row; });
  return {sizes, labels, data};
}
function analyzeSku(sku, all){
  const excluded=[], fits={};
  sku.variants.forEach(v=>fits[v.size]=[]);
  all.forEach(b=>{
    const isExcluded = (sku.excludeGroups||[]).includes(b.group) || (sku.excludeGroups||[]).includes(b.hbucket);
    const bv=bestVariantForBreed(sku,b);
    if(isExcluded || !bv || bv.score<0.15){ excluded.push(b); return; }
    fits[bv.variant.size].push({b,score:bv.score});
  });
  Object.keys(fits).forEach(k=>fits[k].sort((x,y)=> (y.b.sales||0)-(x.b.sales||0) || y.score-x.score));
  return {fits,excluded};
}
function skuAnswer(sku, all){
  const {fits,excluded}=analyzeSku(sku,all);
  const sizes=sku.variants.map(v=>v.size);
  const L=[];
  L.push(`**${sku.name}** — ${sizes.length} sizes: ${sizes.join(", ")}`);
  if(sku.notes) L.push(sku.notes);
  L.push(``);
  // excluded summary
  const exNamed=excluded.filter(b=>b.pop>=3 || (b.sales||0)>800).slice(0,6).map(b=>b.name);
  if(sku.type!=="apparel" && (sku.positioning==="functional" || sku.pullFocus))
    L.push(`As a functional${sku.pullFocus?" no-pull":""} product it suits most breeds but is **not ideal for X-Small / toy breeds**${exNamed.length?` — e.g. ${exNamed.join(", ")}`:""}.`);
  L.push(``);
  // per-variant recommendation in the requested style
  sku.variants.forEach(v=>{
    const list=fits[v.size]||[];
    if(!list.length){ L.push(`**${v.size}** — no strong breed match in the database.`); return; }
    const lead=list.slice(0,3).map(x=>x.b.name).join(", ");
    if(sku.type==="apparel"){
      const hi = v.lengthMax>=999?"+":`–${v.lengthMax}`;
      L.push(`**${v.size}** — best for ${lead}${list.length>3?` (+${list.length-3} more)`:""}. Garment back-length ~${v.garmentLength??"—"} cm, fits body length ${v.lengthMin}${hi} cm.`);
      return;
    }
    const wt = v.weightMin!=null?`${v.weightMin}–${v.weightMax} kg`:"—";
    L.push(`**${v.size}** — best for ${lead}${list.length>3?` (+${list.length-3} more)`:""}. Typical dog: ~${wt}, neck ${v.neckMin}–${v.neckMax} cm, chest ${v.chestMin}–${v.chestMax} cm${v.lengthMin!=null?`, back length ${v.lengthMin}–${v.lengthMax} cm`:""}.`);
  });
  L.push(``);
  if(sku.pullFocus) L.push(`Best suited to dogs that pull strongly — front-clip control point and load-rated hardware. For calm toy breeds, a soft back-clip harness is the better call.`);
  L.push(sku.type==="apparel"
    ? `_Body length is estimated for every breed (confidence capped at B) — no breed has been field-measured for length yet. Treat sizing as a starting point, not a guarantee; individual garments vary ±a size._`
    : `_Sizes reflect ${sku.name} variant dimensions; breed girths carry their own A/B/C confidence. Validate borderline dogs in the fit lab._`);
  return L.join("\n");
}

function curatedSkuToProduct(sk){
  // 999 is our "open-ended" sentinel for the top apparel size (82 cm+) — cap it
  // to a realistic ceiling for aggregation/display instead of letting it stand as 999.
  const capLen = m => m>=999 ? 95 : m;
  const agg = sk.type==="apparel"
    ? { neck:null, chest:null, length:[Math.min(...sk.variants.map(v=>v.lengthMin)), Math.max(...sk.variants.map(v=>capLen(v.lengthMax)))] }
    : { neck:[Math.min(...sk.variants.map(v=>v.neckMin)), Math.max(...sk.variants.map(v=>v.neckMax))],
        chest: sk.type==="harness" ? [Math.min(...sk.variants.map(v=>v.chestMin)), Math.max(...sk.variants.map(v=>v.chestMax))] : null,
        length:null };
  return {
    name: sk.name,
    category: sk.type==="apparel" ? "Clothing" : "Collars, Leashes & Harnesses",
    subCategory: sk.type==="apparel" ? "Apparel (auto-sized)" : sk.type==="harness" ? "Harness" : "Collar",
    petType: "Dog",
    collection: null,
    season: null,
    image: null,
    url: sk.url,
    fitMatched: true,
    agg,
    variants: sk.variants.map(v=>({
      size: v.size,
      sku: sk.id+"-"+v.size,
      dimension: sk.type==="apparel"
        ? (v.lengthMax>=999 ? `Body length ${v.lengthMin}+ cm` : `Body length ${v.lengthMin}–${v.lengthMax} cm`)
        : `Neck ${v.neckMin??"–"}–${v.neckMax??"–"} cm · Chest ${v.chestMin}–${v.chestMax} cm`,
      // raw structured per-size measurements, so the Fit Checker can load a single
      // size's dims instead of the whole product's flattened min/max aggregate.
      raw: sk.type==="apparel"
        ? {lengthMin:v.lengthMin, lengthMax:capLen(v.lengthMax)}
        : {neckMin:v.neckMin, neckMax:v.neckMax, chestMin:sk.type==="harness"?v.chestMin:null, chestMax:sk.type==="harness"?v.chestMax:null},
    })),
  };
}

/* Aggregate a catalog product's variants into overall neck/chest/length ranges
   for the Fit Checker. Curated SKUs carry a precomputed `agg`; Odoo products are
   derived from each variant's parsed Dimension text (label-matched, so a
   Leash's "Length" is never mistaken for a Clothing item's body length). */
// Dims for a single variant (one size) of a product — used both to build the
// whole-product aggregate below and to let the Fit Checker load just one size.
// Any parsed attribute that isn't neck/girth/clothing-length still matters —
// e.g. a leash's own "Length", or a collar's "Width" — so it's kept as `extra`
// instead of being silently dropped, for other variants that carry multiple
// distinct attributes.
function dimsOfVariant(product, v){
  if(!v) return {neck:null,chest:null,length:null,extra:[]};
  if(v.raw){
    const r=v.raw;
    return {
      neck: r.neckMin!=null ? [r.neckMin, r.neckMax] : null,
      chest: r.chestMin!=null ? [r.chestMin, r.chestMax] : null,
      length: r.lengthMin!=null ? [r.lengthMin, r.lengthMax] : null,
      extra: [],
    };
  }
  const neck=[], chest=[], length=[]; const extraMap={};
  (v.dimParsed||[]).forEach(d=>{
    const lbl=(d.label||"").toLowerCase();
    const lo=d.value, hi=(d.valueMax!=null?d.valueMax:d.value);
    if(lbl.includes("neck")){ neck.push(lo); neck.push(hi); }
    else if(lbl.includes("girth")){ chest.push(lo); chest.push(hi); }
    else if(lbl==="length" && product.category==="Clothing"){ length.push(lo); length.push(hi); }
    else {
      const key=d.label||"Attribute";
      (extraMap[key]=extraMap[key]||[]).push(lo, hi);
    }
  });
  const extra=Object.entries(extraMap).map(([label,vals])=>({label, range:[Math.min(...vals),Math.max(...vals)]}));
  return {
    neck: neck.length?[Math.min(...neck),Math.max(...neck)]:null,
    chest: chest.length?[Math.min(...chest),Math.max(...chest)]:null,
    length: length.length?[Math.min(...length),Math.max(...length)]:null,
    extra,
  };
}

function aggregateDims(product, variant){
  if(!product) return {neck:null,chest:null,length:null,extra:[]};
  if(variant) return dimsOfVariant(product, variant);
  if(product.agg) return {extra:[], ...product.agg};
  const neck=[], chest=[], length=[]; const extraMap={};
  (product.variants||[]).forEach(v=>{
    const d=dimsOfVariant(product,v);
    if(d.neck){ neck.push(d.neck[0]); neck.push(d.neck[1]); }
    if(d.chest){ chest.push(d.chest[0]); chest.push(d.chest[1]); }
    if(d.length){ length.push(d.length[0]); length.push(d.length[1]); }
    (d.extra||[]).forEach(e=>{ (extraMap[e.label]=extraMap[e.label]||[]).push(e.range[0], e.range[1]); });
  });
  const extra=Object.entries(extraMap).map(([label,vals])=>({label, range:[Math.min(...vals),Math.max(...vals)]}));
  return {
    neck: neck.length?[Math.min(...neck),Math.max(...neck)]:null,
    chest: chest.length?[Math.min(...chest),Math.max(...chest)]:null,
    length: length.length?[Math.min(...length),Math.max(...length)]:null,
    extra,
  };
}

  const PETS = useMemo(()=>["All",...Array.from(new Set(catalog.map(p=>p.petType))).sort()],[catalog]);

  const filtered = useMemo(()=>catalog.filter(p=>
    (cat==="All"||p.category===cat) &&
    (sub==="All"||p.subCategory===sub) &&
    (pet==="All"||p.petType===pet) &&
    (q.trim()===""||p.name.toLowerCase().includes(q.toLowerCase()))
  ),[catalog,cat,sub,pet,q]);

  const totalSkus = catalog.reduce((n,p)=>n+p.variants.length,0);
  const card={background:"#fff",borderRadius:8,border:"1px solid #E6E9EF",padding:16,marginBottom:12};
  const sel={padding:"6px 10px",borderRadius:7,border:"1px solid #C3C6D4",fontSize:12.5,fontFamily:"inherit",background:"#fff"};

  if(showAdd) return <AddProductForm onAdd={addProduct} onClose={()=>setShowAdd(false)}/>;

  return (
    <React.Fragment>
      <section style={card}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap",marginBottom:10}}>
          <div>
            <h3 style={{margin:0,fontSize:15}}>HUFT Catalog</h3>
            <p style={{fontSize:12.5,color:"#676879",margin:"4px 0 0"}}>{catalog.length.toLocaleString()} products · {totalSkus.toLocaleString()} SKUs — {odooCount.toLocaleString()} from the Odoo export, {curatedCount} fit-matched, {customCount} team-added.</p>
          </div>
          <button onClick={()=>setShowAdd(true)} style={{background:"#FF6D1F",color:"#fff",border:"none",borderRadius:8,padding:"9px 18px",fontWeight:600,fontSize:13.5,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>+ Add product</button>
        </div>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search product name…"
          style={{width:"100%",boxSizing:"border-box",padding:"9px 14px",borderRadius:8,border:"1.5px solid #E6E9EF",fontSize:13.5,fontFamily:"inherit",marginBottom:10}}/>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <select value={cat} onChange={e=>{setCat(e.target.value);setSub("All");}} style={sel}>
            {CATS.map(c=><option key={c} value={c}>{c==="All"?"All categories":c}</option>)}
          </select>
          <select value={sub} onChange={e=>setSub(e.target.value)} style={sel}>
            {SUBS.map(s=><option key={s} value={s}>{s==="All"?"All sub-categories":s}</option>)}
          </select>
          <select value={pet} onChange={e=>setPet(e.target.value)} style={sel}>
            {PETS.map(p=><option key={p} value={p}>{p==="All"?"All pets":p}</option>)}
          </select>
          <span style={{fontSize:12,color:"#9699A6"}}>{filtered.length.toLocaleString()} match{filtered.length===1?"":"es"}</span>
        </div>
      </section>
      {odooCount===0 && <p style={{textAlign:"center",color:"#9699A6",fontSize:12.5}}>Odoo catalog data not loaded — check that products-catalog.js is present alongside index.html. Fit-matched and team-added products still show below.</p>}
      {filtered.slice(0,300).map((p,i)=>{
        const open=expanded===i;
        return (
          <div key={p.name+i} style={{...card,display:"flex",gap:12,alignItems:"flex-start"}}>
            <div style={{width:56,height:56,borderRadius:8,background:"#F5F6F8",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>📦</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
                <div style={{fontWeight:700,fontSize:14,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  {p.name}
                  {p.fitMatched && <span style={{fontSize:9.5,fontWeight:700,padding:"2px 7px",borderRadius:999,background:"#E5F9F0",color:"#00854D"}}>FIT-MATCHED</span>}
                  {p.custom && <span style={{fontSize:9.5,fontWeight:700,padding:"2px 7px",borderRadius:999,background:"#F0F1F6",color:"#565A6E"}}>TEAM-ADDED</span>}
                </div>
                <div style={{display:"flex",gap:6,flexShrink:0}}>
                  {p.fitMatched && <button onClick={()=>onAsk&&onAsk(p.name)} style={{border:"1px solid #FF6D1F",background:"#fff",color:"#FF6D1F",borderRadius:7,padding:"3px 10px",fontSize:11.5,cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>Ask fit →</button>}
                  {p.custom && <button onClick={()=>removeProduct(p.name)} style={{border:"1px solid #E6E9EF",background:"#fff",color:"#E2445C",borderRadius:7,padding:"3px 10px",fontSize:11.5,cursor:"pointer",fontFamily:"inherit"}}>Remove</button>}
                  <button onClick={()=>setExpanded(open?null:i)} style={{border:"1px solid #E6E9EF",background:"#fff",borderRadius:7,padding:"3px 10px",fontSize:11.5,cursor:"pointer",fontFamily:"inherit",color:"#40434E"}}>{open?"Hide":`${p.variants.length} size${p.variants.length>1?"s":""}`}</button>
                </div>
              </div>
              <div style={{fontSize:11.5,color:"#9699A6",marginTop:2}}>{p.category} · {p.subCategory} · {p.petType}{p.collection?` · ${p.collection}`:""}</div>
              {open && (
                <div style={{marginTop:8,display:"flex",flexWrap:"wrap",gap:6}}>
                  {p.variants.map(v=>(
                    <span key={v.sku} title={v.sku} style={{...MONO,fontSize:11,padding:"3px 9px",borderRadius:999,background:"#F5F6F8",color:"#40434E"}}>{v.size}{v.dimension?` · ${v.dimension}`:""}</span>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      })}
      {filtered.length===0 && <p style={{textAlign:"center",color:"#9699A6"}}>No products match — clear the search or filters.</p>}
      {filtered.length>300 && <p style={{textAlign:"center",color:"#9699A6",fontSize:12.5}}>Showing first 300 of {filtered.length.toLocaleString()} — narrow your search or filters to see more.</p>}
    </React.Fragment>
  );
}

/* ---------- add-a-product form (Odoo-style fields) ---------- */
function AddProductForm({onAdd,onClose}){
  const [name,setName]=useState("");
  const [category,setCategory]=useState("Clothing");
  const [subCategory,setSubCategory]=useState("");
  const [petType,setPetType]=useState("Dog");
  const [collection,setCollection]=useState("");
  const [image,setImage]=useState("");
  const [variants,setVariants]=useState([{size:"M",dimension:"Length - 30 cm"}]);
  const [err,setErr]=useState("");
  const inp={fontFamily:"inherit",fontSize:13.5,fontWeight:500,padding:"7px 9px",borderRadius:7,border:"1.5px solid #C3C6D4",width:"100%",boxSizing:"border-box"};
  const lbl={fontSize:10.5,letterSpacing:"0.05em",textTransform:"uppercase",color:"#676879",fontWeight:600,display:"block",marginBottom:3};
  const sel={...inp,background:"#fff"};
  const setVariant=(i,k,v)=>setVariants(vs=>vs.map((row,j)=>j===i?{...row,[k]:v}:row));
  const addRow=()=>setVariants(vs=>[...vs,{size:"",dimension:""}]);
  const rmRow=i=>setVariants(vs=>vs.filter((_,j)=>j!==i));
  const submit=()=>{
    if(!name.trim()) return setErr("Product name is required.");
    if(!subCategory.trim()) return setErr("Sub-category is required (e.g. Harness, T-Shirt, Chew Toy).");
    const cleanVariants=variants.filter(v=>v.size.trim());
    if(!cleanVariants.length) return setErr("At least one size is required.");
    onAdd({
      name:name.trim(), category, subCategory:subCategory.trim(), petType, collection:collection.trim()||null,
      season:null, image:image.trim()||null, custom:true,
      variants:cleanVariants.map((v,i)=>({size:v.size.trim(), sku:"CUSTOM-"+Date.now()+"-"+i, dimension:v.dimension.trim()})),
    });
  };
  return (
    <section style={{background:"#fff",borderRadius:8,border:"1.5px solid #FF6D1F",padding:16,marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <h3 style={{margin:0,fontSize:15}}>Add a product</h3>
        <button onClick={onClose} style={{border:"1px solid #E6E9EF",background:"#fff",borderRadius:7,padding:"4px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit",color:"#676879"}}>Cancel</button>
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
        <div style={{flex:2,minWidth:200}}><span style={lbl}>Product name</span><input value={name} onChange={e=>setName(e.target.value)} placeholder="HUFT Magical Mist Raincoat For Pets - Coral" style={inp}/></div>
        <div style={{flex:1,minWidth:140}}><span style={lbl}>Category</span>
          <select value={category} onChange={e=>setCategory(e.target.value)} style={sel}>
            <option>Clothing</option><option>Collars, Leashes & Harnesses</option><option>Pet Toys</option><option>Other</option>
          </select>
        </div>
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
        <div style={{flex:1,minWidth:160}}><span style={lbl}>Sub-category</span><input value={subCategory} onChange={e=>setSubCategory(e.target.value)} placeholder="e.g. Raincoat, Harness, Chew Toy" style={inp}/></div>
        <div style={{flex:1,minWidth:120}}><span style={lbl}>Pet type</span>
          <select value={petType} onChange={e=>setPetType(e.target.value)} style={sel}>
            <option>Dog</option><option>Cat</option><option>Dog/Cat</option>
          </select>
        </div>
        <div style={{flex:1,minWidth:140}}><span style={lbl}>Collection (optional)</span><input value={collection} onChange={e=>setCollection(e.target.value)} placeholder="e.g. Monsoon 24" style={inp}/></div>
      </div>
      <div style={{marginBottom:10}}><span style={lbl}>Image URL (optional)</span><input value={image} onChange={e=>setImage(e.target.value)} placeholder="https://cdn.shopify.com/…" style={inp}/></div>
      <span style={lbl}>Sizes & dimensions</span>
      <div style={{display:"grid",gap:6,marginTop:4}}>
        {variants.map((v,i)=>(
          <div key={i} style={{display:"flex",gap:6,alignItems:"center"}}>
            <input value={v.size} onChange={e=>setVariant(i,"size",e.target.value)} placeholder="Size (e.g. M)" style={{...inp,maxWidth:110}}/>
            <input value={v.dimension} onChange={e=>setVariant(i,"dimension",e.target.value)} placeholder="Dimension (e.g. Length - 30 cm)" style={inp}/>
            {variants.length>1 && <button onClick={()=>rmRow(i)} style={{border:"none",background:"transparent",color:"#E2445C",cursor:"pointer",fontSize:16,flexShrink:0}}>×</button>}
          </div>
        ))}
      </div>
      <button onClick={addRow} style={{marginTop:8,border:"1px dashed #C3C6D4",background:"#fff",borderRadius:7,padding:"6px 14px",fontSize:12.5,cursor:"pointer",fontFamily:"inherit",color:"#676879"}}>+ Add size</button>
      {err && <p style={{color:"#E2445C",fontSize:13,margin:"12px 0 0"}}>{err}</p>}
      <div style={{marginTop:14}}>
        <button onClick={submit} style={{background:"#FF6D1F",color:"#fff",border:"none",borderRadius:8,padding:"9px 20px",fontSize:13.5,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Add product</button>
      </div>
    </section>
  );
}

function ProductsTab({skus,all,onSave,onAsk}){
  const [editing,setEditing]=useState(null); // sku id or "new"

  const blank=()=>({id:"sku_"+Date.now(),name:"",type:"harness",url:"",positioning:"functional",pullFocus:false,excludeGroups:["Toy","X-Small"],notes:"",
    variants:[{size:"Small",neckMin:33,neckMax:46,chestMin:46,chestMax:61,lengthMin:28,lengthMax:38,weightMin:6,weightMax:11}]});

    onCancel={()=>setEditing(null)} onSave={sk=>{ const exists=skus.some(s=>s.id===sk.id); onSave(exists?skus.map(s=>s.id===sk.id?sk:s):[...skus,sk]); setEditing(null); setExpanded(sk.id);}}

        <button onClick={()=>setEditing("new")} style={{background:"#FF6D1F",color:"#fff",border:"none",borderRadius:8,padding:"9px 18px",fontWeight:600,fontSize:13.5,cursor:"pointer",fontFamily:"inherit"}}>+ Add product</button>
      </section>
      {skus.map(sk=>{

              <div style={{fontSize:12,color:"#676879",marginTop:2}}>{sk.variants.length} sizes: {sk.variants.map(v=>v.size).join(", ")}{sk.pullFocus?" · no-pull / functional":""}</div>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <button onClick={()=>onAsk(sk.name)} style={{background:"#323338",color:"#fff",border:"none",borderRadius:7,padding:"7px 13px",fontSize:12.5,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Ask fit →</button>
              <button onClick={()=>setEditing(sk.id)} style={{border:"1px solid #E6E9EF",background:"#fff",borderRadius:7,padding:"7px 13px",fontSize:12.5,cursor:"pointer",fontFamily:"inherit",color:"#40434E"}}>Edit</button>
              <button onClick={()=>setExpanded(open?null:sk.id)} style={{border:"1px solid #E6E9EF",background:"#fff",borderRadius:7,padding:"7px 11px",fontSize:12.5,cursor:"pointer",fontFamily:"inherit",color:"#40434E"}}>{open?"Hide":"Preview"}</button>
            </div>
          </div>
          {sk.url && <a href={sk.url} target="_blank" rel="noreferrer" style={{fontSize:11.5,color:"#FF6D1F",wordBreak:"break-all"}}>{sk.url}</a>}
          {open && <div style={{marginTop:12,background:"#F6F7FB",borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap"}}>
            {skuAnswer(sk,all).split("\n").map((ln,i)=>{const p=ln.split("**");return <div key={i} style={{minHeight:ln?undefined:8}}>{p.map((x,j)=>j%2?<b key={j}>{x}</b>:<span key={j}>{x.replace(/_/g,"")}</span>)}</div>;})}
          </div>}
        </div>);
      })}

  );
}

function ProductEditor({sku,all,onCancel,onSave,onDelete}){
  const [f,setF]=useState(JSON.parse(JSON.stringify(sku)));
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setV=(i,k,v)=>setF(p=>({...p,variants:p.variants.map((vv,j)=>j===i?{...vv,[k]:v===""?null:Number(v)}:vv)}));
  const setVs=(i,k,v)=>setF(p=>({...p,variants:p.variants.map((vv,j)=>j===i?{...vv,[k]:v}:vv)}));
  const addV=()=>setF(p=>({...p,variants:[...p.variants,{size:"New",neckMin:0,neckMax:0,chestMin:0,chestMax:0,lengthMin:null,lengthMax:null,weightMin:null,weightMax:null}]}));
  const rmV=i=>setF(p=>({...p,variants:p.variants.filter((_,j)=>j!==i)}));
  const toggleEx=g=>setF(p=>({...p,excludeGroups:p.excludeGroups.includes(g)?p.excludeGroups.filter(x=>x!==g):[...p.excludeGroups,g]}));
  const lbl={fontSize:10.5,letterSpacing:"0.05em",textTransform:"uppercase",color:"#676879",fontWeight:600,display:"block",marginBottom:3};
  const inp={fontFamily:"'IBM Plex Mono',monospace",fontSize:13,fontWeight:600,padding:"6px 7px",borderRadius:6,border:"1.5px solid #E6E9EF",width:"100%",boxSizing:"border-box"};
  const tinp={...inp,fontFamily:"inherit",fontWeight:500};
  const card={background:"#fff",borderRadius:8,border:"1.5px solid #FF6D1F",padding:16,marginBottom:12};
  const num=(i,k)=><input type="number" step="0.5" value={f.variants[i][k]==null?"":f.variants[i][k]} onChange={e=>setV(i,k,e.target.value)} style={inp}/>;
  return (
    <section style={card}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <h3 style={{margin:0,fontSize:15}}>{sku.name?"Edit product":"New product"}</h3>
        <button onClick={onCancel} style={{border:"1px solid #E6E9EF",background:"#fff",borderRadius:7,padding:"4px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit",color:"#676879"}}>Cancel</button>
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
        <div style={{flex:2,minWidth:180}}><span style={lbl}>Product name</span><input value={f.name} onChange={e=>set("name",e.target.value)} placeholder="HUFT Xplorers Harness" style={tinp}/></div>
        <div style={{flex:1,minWidth:110}}><span style={lbl}>Type</span><select value={f.type} onChange={e=>set("type",e.target.value)} style={{...tinp}}><option value="harness">harness</option><option value="collar">collar</option><option value="apparel">apparel</option></select></div>
      </div>
      <div style={{marginBottom:10}}><span style={lbl}>Shopify URL</span><input value={f.url} onChange={e=>set("url",e.target.value)} placeholder="https://headsupfortails.com/products/…" style={tinp}/></div>
      <div style={{marginBottom:10}}><span style={lbl}>Positioning notes (shown in the answer)</span><input value={f.notes} onChange={e=>set("notes",e.target.value)} placeholder="No-pull functional harness; best for dogs that pull." style={tinp}/></div>
      <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:12,alignItems:"center"}}>
        <label style={{display:"flex",gap:6,alignItems:"center",fontSize:13,cursor:"pointer"}}><input type="checkbox" checked={f.pullFocus} onChange={e=>set("pullFocus",e.target.checked)}/> No-pull / for strong pullers</label>
        <span style={{fontSize:12.5,color:"#676879"}}>Exclude buckets:</span>
        {["X-Small","Toy","Giant"].map(g=><button key={g} onClick={()=>toggleEx(g)} style={{padding:"4px 11px",borderRadius:999,fontSize:11.5,fontWeight:600,cursor:"pointer",fontFamily:"inherit",border:f.excludeGroups.includes(g)?"1.5px solid #E2445C":"1.5px solid #E6E9EF",background:f.excludeGroups.includes(g)?"#FCE9EC":"#fff",color:f.excludeGroups.includes(g)?"#E2445C":"#676879"}}>{g}</button>)}
      </div>
      <span style={lbl}>Size variants (cm, kg)</span>
      <div style={{overflowX:"auto"}}>
        <table style={{borderCollapse:"collapse",width:"100%",minWidth:640,fontSize:12}}>
          <thead><tr style={{textAlign:"left",color:"#676879"}}>
            {["Size","Neck min","Neck max","Chest min","Chest max","Len min","Len max","Wt min","Wt max",""].map(h=><th key={h} style={{padding:"4px 5px",fontWeight:600,fontSize:10.5,textTransform:"uppercase"}}>{h}</th>)}
          </tr></thead>
          <tbody>
            {f.variants.map((v,i)=>(
              <tr key={i}>
                <td style={{padding:"3px 5px",minWidth:80}}><input value={v.size} onChange={e=>setVs(i,"size",e.target.value)} style={tinp}/></td>
                <td style={{padding:"3px 5px"}}>{num(i,"neckMin")}</td><td style={{padding:"3px 5px"}}>{num(i,"neckMax")}</td>
                <td style={{padding:"3px 5px"}}>{num(i,"chestMin")}</td><td style={{padding:"3px 5px"}}>{num(i,"chestMax")}</td>
                <td style={{padding:"3px 5px"}}>{num(i,"lengthMin")}</td><td style={{padding:"3px 5px"}}>{num(i,"lengthMax")}</td>
                <td style={{padding:"3px 5px"}}>{num(i,"weightMin")}</td><td style={{padding:"3px 5px"}}>{num(i,"weightMax")}</td>
                <td style={{padding:"3px 5px"}}>{f.variants.length>1 && <button onClick={()=>rmV(i)} style={{border:"none",background:"transparent",color:"#E2445C",cursor:"pointer",fontSize:15}}>×</button>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <button onClick={addV} style={{marginTop:8,border:"1px dashed #C3C6D4",background:"#fff",borderRadius:7,padding:"6px 14px",fontSize:12.5,cursor:"pointer",fontFamily:"inherit",color:"#676879"}}>+ Add size</button>
      <div style={{display:"flex",gap:8,marginTop:14,flexWrap:"wrap"}}>
        <button onClick={()=>{ if(!f.name.trim()){alert("Name required");return;} onSave(f); }} style={{background:"#FF6D1F",color:"#fff",border:"none",borderRadius:8,padding:"9px 20px",fontWeight:600,fontSize:13.5,cursor:"pointer",fontFamily:"inherit"}}>Save product</button>
        {sku.name && <button onClick={()=>{ if(window.confirm("Delete this product?")) onDelete(f.id); }} style={{border:"1px solid #F0A6B4",background:"#fff",color:"#E2445C",borderRadius:8,padding:"9px 16px",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>Delete</button>}
      </div>
      <div style={{marginTop:14,background:"#F6F7FB",borderRadius:8,padding:"12px 14px",fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap"}}>
        <div style={{fontSize:10.5,textTransform:"uppercase",letterSpacing:"0.05em",color:"#676879",marginBottom:6,fontWeight:600}}>Live preview</div>
        {skuAnswer(f,all).split("\n").map((ln,i)=>{const p=ln.split("**");return <div key={i} style={{minHeight:ln?undefined:8}}>{p.map((x,j)=>j%2?<b key={j}>{x}</b>:<span key={j}>{x.replace(/_/g,"")}</span>)}</div>;})}
      </div>
    </section>
  );
}

function AskTab({all}){
  const [msgs,setMsgs]=useState([{role:"bot",text:"Hi! I'm the HUFT Fit engine. Ask me anything about the "+all.length+" breeds in the database — sizes, fit, behaviour, regions, materials. I answer only from the portal's data, with confidence tiers attached."}]);
  const [input,setInput]=useState("");
  useEffect(()=>{ window.__ASK_PREFILL__=(q)=>{ setInput(q); setTimeout(()=>send(q),30); }; return ()=>{window.__ASK_PREFILL__=null;}; },[]);
  const send=(text)=>{
    const q=(text!==undefined?text:input).trim(); if(!q) return;
    const a=answerQuestion(q, all);
    setMsgs(m=>[...m,{role:"user",text:q},{role:"bot",text:a}]);
    setInput("");
    setTimeout(()=>{const el=document.getElementById("chat-end"); if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"});},60);
  };

  const [fitExtra,setFitExtra]=useState([]);
  const [noDims,setNoDims]=useState(false);
  const [gradeFilter,setGradeFilter]=useState(null);
  const [query,setQuery]=useState("");
  const [grp,setGrp]=useState("All");
  const [readyFilter,setReadyFilter]=useState("All");
  const [askOpen,setAskOpen]=useState(false);
  const [regionTab,setRegionTab]=useState("n");
  const [saved,setSaved]=useState(()=>store.get(KEY_PRODUCTS,[]));
  const [feedback,setFeedback]=useState(()=>store.get(KEY_FEEDBACK,[]));
  const [customBreeds,setCustomBreeds]=useState(()=>store.get(KEY_CUSTOM,[]));
  const [skus,setSkus]=useState(()=>{ const saved=store.get(KEY_SKUS,null); return saved&&saved.length?saved:SEED_SKUS; });
  useEffect(()=>{ window.__HUFT_SKUS__=skus; },[skus]);
  const persistSkus=l=>{setSkus(l); store.set(KEY_SKUS,l);};
  const [customProducts,setCustomProducts]=useState(()=>store.get(KEY_CUSTOM_PRODUCTS,[]));
  const addCustomProduct=p=>{const l=[...customProducts,p]; setCustomProducts(l); store.set(KEY_CUSTOM_PRODUCTS,l);};
  const removeCustomProduct=name=>{const l=customProducts.filter(p=>p.name!==name); setCustomProducts(l); store.set(KEY_CUSTOM_PRODUCTS,l);};
  const curatedProducts=useMemo(()=>skus.map(curatedSkuToProduct),[skus]);
  const odooProducts=(typeof PRODUCT_CATALOG!=="undefined")?PRODUCT_CATALOG:[];
  const fullCatalog=useMemo(()=>[...curatedProducts,...odooProducts,...customProducts],[curatedProducts,customProducts]);
  const [showAddBreed,setShowAddBreed]=useState(false);
  const ALL=useMemo(()=>[...BREEDS,...customBreeds],[customBreeds]);
  const [toast,setToast]=useState("");
  const say=m=>{setToast(m);setTimeout(()=>setToast(""),2500);};

  const persistProducts=l=>{setSaved(l); if(!store.set(KEY_PRODUCTS,l)) say("Storage unavailable — export before closing");};
  const addFeedback=f=>{const l=[...feedback,f]; setFeedback(l); if(store.set(KEY_FEEDBACK,l)) say("Feedback saved — thank you"); else say("Storage unavailable");};
  const addCustomBreed=b=>{const l=[...customBreeds,b]; setCustomBreeds(l); if(store.set(KEY_CUSTOM,l)) say(`"${b.name}" added to database`); else say("Storage unavailable — export before closing"); setShowAddBreed(false);};
  const removeCustomBreed=name=>{ if(!window.confirm(`Remove custom breed "${name}"? This cannot be undone.`)) return; const l=customBreeds.filter(b=>b.name!==name); setCustomBreeds(l); store.set(KEY_CUSTOM,l); say(`Removed "${name}"`);};

  const fitCatOptions = useMemo(()=>["All",...Array.from(new Set(fullCatalog.map(p=>p.category))).sort()],[fullCatalog]);
  const fitSubOptions = useMemo(()=>["All",...Array.from(new Set(fullCatalog.filter(p=>fitCat==="All"||p.category===fitCat).map(p=>p.subCategory))).sort()],[fullCatalog,fitCat]);
  const fitProductOptions = useMemo(()=>fullCatalog.filter(p=>(fitCat==="All"||p.category===fitCat)&&(fitSub==="All"||p.subCategory===fitSub)),[fullCatalog,fitCat,fitSub]);
  // A single catalog size gives one fixed measurement (min===max) — show it as
  // a plain value ("29 cm"), not a zero-width "range" ("29–29 cm").
  const fmtDim=(r)=> r[0]===r[1] ? `${r[0]} cm` : `${r[0]}–${r[1]} cm`;
  const applyDimsFromAgg=(agg,label,name)=>{
    // Never drop attributes a variant carries beyond neck/chest/length (e.g. a
    // leash's own length, a collar's width) — keep them visible as extra context
    // even though they don't feed the breed-fit percentage.
    setFitExtra(agg.extra||[]);
    if(agg.length){
      setNoDims(false);
      setPtype("apparel"); setLengthMin(agg.length[0]); setLengthMax(agg.length[1]);
      setFitNote(`Loaded body length ${fmtDim(agg.length)} ${label}.`);
    } else if(agg.chest){
      setNoDims(false);
      setPtype("harness"); if(agg.neck){setNeckMin(agg.neck[0]);setNeckMax(agg.neck[1]);} setChestMin(agg.chest[0]); setChestMax(agg.chest[1]);
      const parts=[agg.neck?`neck ${fmtDim(agg.neck)}`:null,`chest ${fmtDim(agg.chest)}`].filter(Boolean).join(" & ");
      setFitNote(`Loaded ${parts} ${label}.`);
    } else if(agg.neck){
      setNoDims(false);
      setPtype("collar"); setNeckMin(agg.neck[0]); setNeckMax(agg.neck[1]);
      setFitNote(`Loaded neck ${fmtDim(agg.neck)} ${label}.`);
    } else {
      setNoDims(true);
      const extraList=(agg.extra||[]).map(e=>e.label.toLowerCase()+" "+fmtDim(e.range)).join(", ");
      const extraBit=extraList ? (" It does carry "+extraList+", but that's not a dog-fit measurement.") : "";
      setFitNote(`"${name}" doesn't have structured neck/chest/length measurements to auto-fill.${extraBit} Showing No fit for all breeds until you enter dimensions manually below.`);
    }
  };
  const applyProduct=(name)=>{
    setFitProductName(name);
    if(!name){ setFitVariantSize(""); setFitNote(""); setNoDims(false); setFitExtra([]); return; }
    const p=fullCatalog.find(x=>x.name===name);
    if(!p){ setFitVariantSize(""); setFitNote(""); setNoDims(false); setFitExtra([]); return; }
    // Always default to a specific size — never a combined all-sizes range (that span is not a real product and gives wrong fit info).
    const v=p.variants[0];
    if(v){ setFitVariantSize(v.size); applyDimsFromAgg(aggregateDims(p,v), `for size ${v.size} of "${name}"`, name); }
    else { setFitVariantSize(""); applyDimsFromAgg(aggregateDims(p), `for "${name}"`, name); }
  };
  const applySize=(sizeLabel)=>{
    const p=fullCatalog.find(x=>x.name===fitProductName);
    if(!p) return;
    const v=p.variants.find(x=>x.size===sizeLabel) || p.variants[0];
    if(!v) return;
    setFitVariantSize(v.size);
    applyDimsFromAgg(aggregateDims(p,v), `for size ${v.size} of "${fitProductName}"`, fitProductName);
  };
  const manualEdit=(setter)=>(v)=>{ setter(v); setNoDims(false); };

  // A single catalog size (e.g. "5XL") carries one fixed measurement, not a range —
  // min===max in that case. Allow that (>=) rather than requiring a true range (>).
  const validDims = ptype==="apparel" ? (lengthMin!==""&&lengthMax!==""&&lengthMax>=lengthMin)
    : ptype==="collar" ? (neckMin!==""&&neckMax!==""&&neckMax>=neckMin)
    : (neckMin!==""&&neckMax!==""&&chestMin!==""&&chestMax!==""&&neckMax>=neckMin&&chestMax>=chestMin);

  // overlapPct treats a zero-width range as "no overlap" by design (hi<=lo -> 0),
  // which is right for a genuine range but wrong for one fixed garment measurement —
  // that should instead be checked with a small real-world fit tolerance around it.
  const FIT_PAD=2;
  const padRange=(r)=> (r[0]===r[1] ? [r[0]-FIT_PAD, r[1]+FIT_PAD] : r);

  const results=useMemo(()=>{ if(!validDims) return [];
    if(noDims){
      return ALL.map(b=>({breed:b,nPct:0,cPct:0,combined:0,grade:"none",demand:b.pop})).sort((a,z)=>z.demand-a.demand);
    }
    if(ptype==="apparel"){
      return ALL.map(b=>{ const bodyLen=(b.care&&b.care.bodyLen)||b.height;
        const lPct=overlapPct(bodyLen,padRange([lengthMin,lengthMax]));
        return {breed:b,nPct:lPct,cPct:1,combined:lPct,grade:gradeOf(lPct),demand:b.pop};
      }).sort((a,z)=>z.combined-a.combined||z.demand-a.demand);
    }
    return ALL.map(b=>{ const nPct=overlapPct(b.neck,padRange([neckMin,neckMax]));
      const cPct=ptype==="harness"?overlapPct(b.chest,padRange([chestMin,chestMax])):1;
      const combined=ptype==="harness"?Math.min(nPct,cPct):nPct;
      return {breed:b,nPct,cPct,combined,grade:gradeOf(combined),demand:b.pop};
    }).sort((a,z)=>z.combined-a.combined||z.demand-a.demand);

                    <div style={{overflowX:"auto"}}>
                      <div style={{fontSize:11,color:"#00854D",marginBottom:6}}>✓ Size to order for <b>{fitBreed}</b> — spec from the <b>{model.name}</b> deck (back, chest &amp; neck).</div>
                      <table style={{borderCollapse:"collapse",width:"100%",minWidth:420}}><thead><tr><th style={th}>Size</th><th style={th}>Back length</th><th style={th}>Chest girth</th><th style={th}>Neck</th><th style={th}>Ease vs dog back</th></tr></thead><tbody>
                        {rows.map(({s,i})=>{const on=s===recBase; const ea=Math.round(model.back[i]-dm); return (
                          <tr key={s} style={{background:on?"#FEF1E5":"transparent"}}>
                            <td style={{...td,fontWeight:on?700:600,color:on?"#BA4511":"#323338"}}>{s}{on?" ◄ best":""}</td>
                            <td style={td}>{model.back[i]} cm</td><td style={td}>{model.girth[i]} cm</td><td style={td}>{model.neck[i]} cm</td>
                            <td style={{...td,color:ea<0?"#E2445C":ea>15?"#B47500":"#00854D"}}>{ea>=0?"+":""}{ea} cm</td>
                          </tr>);})}
                      </tbody></table>
                      <p style={{fontSize:11,color:"#9699A6",marginTop:8,lineHeight:1.5}}>{fitBreed} back is {bl[0]}–{bl[1]} cm, chest {b.chest[0]}–{b.chest[1]} cm. These are the sizes to order (same as the grid above); the <b style={{color:"#BA4511"}}>◄ best</b> one is the top pick, the other suits a lighter/heavier dog. "Ease vs dog back" is how much longer the coat runs than the dog.</p>
                    </div>);})()}
                  {prod && !model && (()=>{ const ch=productChart(prod);
                    const recP=(typeof REC_PRODUCTS!=="undefined" && REC_PRODUCTS.includes(drillSub) && REC_MATRIX[fitBreed])?REC_MATRIX[fitBreed][drillSub]:null;
                    const recSizes=recP?recP.pair:null; const recBase=recP?recP.base:null;
                    const bv=!recSizes?bestSizeForBreed(prod,b,ptypeOfSub(drillSub)):null; const single=bv?bv.size:null;
                    const rows=ch.sizes.filter(s=> recSizes? recSizes.includes(s) : (single? s===single : true));
                    return (
                    <div style={{overflowX:"auto"}}>
                      <div style={{fontSize:11,color:"#676879",marginBottom:6}}>Size to order for <b>{fitBreed}</b> — dimensions from the HUFT catalog{ch.labels.length?"":" — this product has no structured per-size dimensions"}.</div>
                      {ch.labels.length>0 && rows.length>0 && <table style={{borderCollapse:"collapse",width:"100%",minWidth:320}}><thead><tr><th style={th}>Size</th>{ch.labels.map(l=><th key={l} style={th}>{l}</th>)}</tr></thead><tbody>
                        {rows.map(s=>{const on=s===(recBase||single); return (
                          <tr key={s} style={{background:on?"#FEF1E5":"transparent"}}>
                            <td style={{...td,fontWeight:on?700:600,color:on?"#BA4511":"#323338"}}>{s}{on?" ◄ best":""}</td>
                            {ch.labels.map(l=><td key={l} style={td}>{ch.data[s]&&ch.data[s][l]?ch.data[s][l]:"—"}</td>)}
                          </tr>);})}
                      </tbody></table>}
                      {rows.length===0 && <p style={{fontSize:12,color:"#9699A6"}}>No recommended size for this breed in this category.</p>}
                    </div>);})()}
                </section>
              );
            })()}
          </>}

          {fitMode==="product" && <>
          <section style={card}>
            <h3 style={{margin:"0 0 4px",fontSize:14.5}}>Pick a product from the catalog</h3>
            <p style={{fontSize:12,color:"#676879",margin:"0 0 10px"}}>Choose a category and a product — dimensions load automatically from {fullCatalog.length.toLocaleString()} products in the HUFT Catalog. Or leave it on manual entry and type dimensions directly below.</p>
            <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
              <select value={fitCat} onChange={e=>{setFitCat(e.target.value);setFitSub("All");setFitProductName("");setFitNote("");}} style={{padding:"9px 10px",borderRadius:8,border:"1.5px solid #C3C6D4",fontSize:13,fontFamily:"inherit",background:"#fff"}}>
                {fitCatOptions.map(c=><option key={c} value={c}>{c==="All"?"All categories":c}</option>)}
              </select>
              <select value={fitProductName} onChange={e=>applyProduct(e.target.value)} style={{flex:1,minWidth:200,padding:"9px 10px",borderRadius:8,border:"1.5px solid #C3C6D4",fontSize:13,fontFamily:"inherit",background:"#fff"}}>
                <option value="">— Manual entry (no product selected) —</option>
                {fitProductOptions.slice(0,500).map(p=><option key={p.name} value={p.name}>{p.name}</option>)}
              </select>
              {fitProductName && (()=>{
                const p=fullCatalog.find(x=>x.name===fitProductName);
                const sizes=p?p.variants.map(v=>v.size):[];
                if(!p || sizes.length<2) return null;
                return (
                  <select value={fitVariantSize} onChange={e=>applySize(e.target.value)} style={{padding:"9px 10px",borderRadius:8,border:"1.5px solid #C3C6D4",fontSize:13,fontFamily:"inherit",background:"#fff"}}>
                    {sizes.map(s=><option key={s} value={s}>{s}</option>)}
                  </select>
                );
              })()}
            </div>
            {fitProductName && (()=>{
              const p=fullCatalog.find(x=>x.name===fitProductName);
              if(!p || p.variants.length<2) return null;
              return (
                <div style={{display:"flex",gap:6,flexWrap:"wrap",margin:"0 0 10px"}}>
                  {p.variants.map(v=>(
                    <button key={v.size} onClick={()=>applySize(v.size)}
                      style={{padding:"4px 9px",borderRadius:999,fontSize:11.5,fontFamily:"inherit",cursor:"pointer",
                        border:v.size===fitVariantSize?"1.5px solid #0073EA":"1.5px solid #DCDFEA",
                        background:v.size===fitVariantSize?"#EAF1FF":"#fff",
                        color:v.size===fitVariantSize?"#0073EA":"#565A6E"}}
                      title={v.dimension||""}>
                      {v.size}
                    </button>
                  ))}
                </div>
              );
            })()}
            {fitNote && <p style={{fontSize:12,color:"#565A6E",background:"#F0F1F6",borderRadius:7,padding:"7px 10px",margin:"0 0 14px"}}>{fitNote}</p>}
            {fitExtra.length>0 && !noDims && (
              <div style={{display:"flex",gap:6,flexWrap:"wrap",margin:"-8px 0 14px"}}>
                {fitExtra.map(e=>(
                  <span key={e.label} style={{fontSize:11,color:"#565A6E",background:"#fff",border:"1.5px solid #E6E9EF",borderRadius:999,padding:"3px 10px"}}>
                    {e.label}: {fmtDim(e.range)}
                  </span>
                ))}
              </div>
            )}
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              {ptype==="apparel" ? (
                (lengthMin!==""&&lengthMax!==""&&lengthMin===lengthMax) ? (
                  <NumBox label="Product length (cm)" value={lengthMin} onChange={v=>{manualEdit(setLengthMin)(v);manualEdit(setLengthMax)(v);}}/>
                ) : <>
                  <NumBox label="Body length min (cm)" value={lengthMin} onChange={manualEdit(setLengthMin)}/>
                  <NumBox label="Body length max (cm)" value={lengthMax} onChange={manualEdit(setLengthMax)}/>
                </>
              ) : <>
                {(neckMin!==""&&neckMax!==""&&neckMin===neckMax) ? (
                  <NumBox label="Neck size (cm)" value={neckMin} onChange={v=>{manualEdit(setNeckMin)(v);manualEdit(setNeckMax)(v);}}/>
                ) : <>
                  <NumBox label="Neck min (cm)" value={neckMin} onChange={manualEdit(setNeckMin)}/>
                  <NumBox label="Neck max (cm)" value={neckMax} onChange={manualEdit(setNeckMax)}/>
                </>}
                {ptype==="harness" && (
                  (chestMin!==""&&chestMax!==""&&chestMin===chestMax) ? (
                    <NumBox label="Chest size (cm)" value={chestMin} onChange={v=>{manualEdit(setChestMin)(v);manualEdit(setChestMax)(v);}}/>
                  ) : <>
                    <NumBox label="Chest min (cm)" value={chestMin} onChange={manualEdit(setChestMin)}/>
                    <NumBox label="Chest max (cm)" value={chestMax} onChange={manualEdit(setChestMax)}/>
                  </>
                )}
                <NumBox label="Webbing width (cm)" value={width} onChange={setWidth} min={0.5} max={8}/>
              </>}
            </div>
            {!validDims && <p style={{color:"#E2445C",fontSize:13,margin:"10px 0 0"}}>Max must be greater than or equal to min for each dimension.</p>}
          </section>

          {validDims && <>
            <div style={{display:"flex",gap:8,marginBottom:8,flexWrap:"wrap"}}>
              {Object.entries(counts).map(([g,n])=>{
                const active=gradeFilter===g;
                return (
                <button key={g} onClick={()=>setGradeFilter(active?null:g)} style={{...MONO,flex:1,minWidth:70,textAlign:"center",background:GRADE[g].bg,color:GRADE[g].color,borderRadius:10,padding:"10px 6px",border:active?`2px solid ${GRADE[g].color}`:`1px solid ${GRADE[g].color}33`,cursor:"pointer",fontFamily:"'IBM Plex Mono', ui-monospace, monospace",opacity:gradeFilter&&!active?0.55:1,transition:"opacity 0.15s"}}>
                  <div style={{fontSize:22,fontWeight:600}}>{n}</div><div style={{fontSize:11}}>{GRADE[g].label}</div>
                </button>);
              })}
            </div>
            {gradeFilter && <p style={{fontSize:12,color:"#676879",margin:"0 0 10px"}}>Showing <b style={{color:GRADE[gradeFilter].color}}>{GRADE[gradeFilter].label}</b> breeds only ({counts[gradeFilter]}) — <span style={{textDecoration:"underline",cursor:"pointer"}} onClick={()=>setGradeFilter(null)}>clear filter</span>.</p>}
            <div style={{display:"flex",gap:14,alignItems:"center",flexWrap:"wrap",fontSize:11,color:"#676879",marginBottom:12}}>
              <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:14,height:10,borderRadius:3,background:"#E6E9F5",border:"1.5px dashed #9699A6",display:"inline-block"}}/>Breed range</span>
              <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:14,height:10,borderRadius:3,background:"#FFC299",display:"inline-block"}}/>Your product</span>
              <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:14,height:10,borderRadius:3,background:"#00A25B",display:"inline-block"}}/>Overlap</span>
            </div>
            {(()=>{const selProd=fullCatalog.find(x=>x.name===fitProductName);return results.filter(r=>(gradeFilter?r.grade===gradeFilter:r.grade!=="none")).map(({breed:b,nPct,cPct,grade,demand})=>{
              const worstConf = ptype==="apparel" ? "B" : ptype==="harness" ? ([b.conf.neck,b.conf.chest].includes("C")?"C":[b.conf.neck,b.conf.chest].includes("B")?"B":"A") : b.conf.neck;
              const bodyLen=(b.care&&b.care.bodyLen)||b.height;
              const recSize = (selProd && grade!=="none") ? bestSizeForBreed(selProd,b,ptype) : null;
              return (
              <div key={b.name} style={{...card,padding:"13px 14px",opacity:grade==="none"?0.62:1}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <div style={{fontWeight:700,fontSize:15}}>{b.name} <span style={{fontWeight:400,fontSize:12,color:"#9699A6"}}>· {b.group} · {"★".repeat(b.pop)}</span> <ConfBadge tier={worstConf}/></div>
                  <span style={{display:"flex",alignItems:"center",gap:8}}>{recSize && <span style={{fontSize:12,fontWeight:700,padding:"3px 11px",borderRadius:999,background:"#FEF1E5",color:"#BA4511",border:"1px solid #FFBE92"}}>Order size {recSize.size}{recSize.cm?` · ${recSize.cm}`:""}</span>}<span style={{fontSize:12,fontWeight:700,padding:"3px 10px",borderRadius:999,background:GRADE[grade].bg,color:GRADE[grade].color}}>{GRADE[grade].label}</span></span>
                </div>
                <div style={{marginTop:10,display:"grid",gap:8}}>
                  {ptype==="apparel" ? (
                    <div>
                      <div style={{...MONO,fontSize:11,color:"#676879",marginBottom:3,display:"flex",justifyContent:"space-between"}}><span>BODY LENGTH · breed {bodyLen[0]}–{bodyLen[1]} cm <span title="Estimated from height/build" style={{cursor:"help"}}>est.</span></span><span>{Math.round(nPct*100)}% covered</span></div>
                      <TapeBar breedRange={bodyLen} prodRange={[lengthMin,lengthMax]} domain={[15,100]}/>
                    </div>
                  ) : <>
                  <div>
                    <div style={{...MONO,fontSize:11,color:"#676879",marginBottom:3,display:"flex",justifyContent:"space-between"}}><span>NECK · breed {b.neck[0]}–{b.neck[1]} cm <ConfBadge tier={b.conf.neck}/></span><span>{Math.round(nPct*100)}% covered</span></div>
                    <TapeBar breedRange={b.neck} prodRange={[neckMin,neckMax]} domain={[15,90]}/>
                  </div>
                  {ptype==="harness" && (
                    <div>
                      <div style={{...MONO,fontSize:11,color:"#676879",marginBottom:3,display:"flex",justifyContent:"space-between"}}><span>CHEST · breed {b.chest[0]}–{b.chest[1]} cm <ConfBadge tier={b.conf.chest}/></span><span>{Math.round(cPct*100)}% covered</span></div>
                      <TapeBar breedRange={b.chest} prodRange={[chestMin,chestMax]} domain={[25,115]}/>
                    </div>
                  )}
                  </>}
                </div>
                {grade!=="none" && (
                  <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:9,alignItems:"center"}}>
                    <Chip text={`Pull ${b.beh.pull}/5`} tip={pullHardware(b.beh.pull)} tone={b.beh.pull>=4?"warn":"info"}/>
                    <Chip text={`Escape ${b.beh.escape}/5`} tip={b.beh.clip} tone={b.beh.escape>=4?"warn":"info"}/>
                    {b.flags.map(f=><Chip key={f} text={FLAG_LABELS[f].label} tip={FLAG_LABELS[f].tip} tone="warn"/>)}
                    {ptype!=="apparel" && <Chip text={widthAdvice(b.neck[1])} tone="info"/>}
                    {ptype==="collar" && b.flags.includes("brachy") && <Chip text="⚠ Recommend harness for walking" tone="warn"/>}
                    {ptype==="collar" && b.flags.includes("slipRisk") && <Chip text="⚠ Martingale advised" tone="warn"/>}
                  </div>
                )}
              </div>);
            })})()}
            {counts.none>0 && <p style={{fontSize:12,color:"#9699A6",margin:"4px 0 0",textAlign:"center"}}>{counts.none} breed{counts.none>1?"s":""} not shown — no usable fit for this product.</p>}
          </>}
          </>}
        </>}

        {/* ===== BREED LIBRARY ===== */}
        {tab==="library" && <>
          <section style={card}>
            <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:2,alignItems:"center"}}>
              <button onClick={()=>setShowAddBreed(!showAddBreed)} style={{padding:"5px 14px",borderRadius:999,fontSize:12.5,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit",border:"1.5px solid #FF6D1F",background:showAddBreed?"#FF6D1F":"#fff",color:showAddBreed?"#fff":"#FF6D1F"}}>+ Add breed</button>
              {GROUPS.map(g=>(
                <button key={g} onClick={()=>setGrp(g)} style={{padding:"5px 12px",borderRadius:999,fontSize:12.5,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit",border:grp===g?"1.5px solid #323338":"1.5px solid #E6E9EF",background:grp===g?"#323338":"#fff",color:grp===g?"#F6C445":"#676879"}}>{g}</button>
              ))}
            </div>
            <div style={{display:"flex",gap:6,paddingTop:8,alignItems:"center"}}>
              <span style={{fontSize:11.5,color:"#9699A6"}}>{(typeof SALES!=="undefined"?ALL.filter(b=>SALES[b.name]&&SALES[b.name].ok).length:0)} sales-verified · rest confirmed by knowledge base only</span>
            </div>
            {query.trim() && <div style={{fontSize:12,color:"#676879",marginTop:8}}>Filtering by search: "{query}" — clear the top bar to see all.</div>}
          </section>
          {showAddBreed && <AddBreedForm existingNames={ALL.map(b=>b.name)} onAdd={addCustomBreed} onClose={()=>setShowAddBreed(false)}/>}
          {filteredBreeds.map(b=><BreedCard key={b.name} b={b} feedback={feedback} onAddFeedback={addFeedback} onDelete={b.custom?removeCustomBreed:null} defaultOpen={filteredBreeds.length===1}/>)}
          {filteredBreeds.length===0 && <p style={{textAlign:"center",color:"#9699A6"}}>No breeds match — clear the search or pick another group.</p>}
        </>}

        {/* ===== HUFT CATALOG (Odoo export + curated fit-matched SKUs + team additions) ===== */}
        {tab==="catalog" && <CatalogTab catalog={fullCatalog} odooCount={odooProducts.length} curatedCount={curatedProducts.length} customCount={customProducts.length}
          onAddProduct={addCustomProduct} onRemoveProduct={removeCustomProduct}
          onAsk={(name)=>{setAskOpen(true);setTimeout(()=>{window.__ASK_PREFILL__&&window.__ASK_PREFILL__(`Which breeds and sizes will the ${name} fit?`);},60);}}/>}

        {/* ===== FEEDBACK LOG ===== */}
        {tab==="feedback" && <>
          <section style={card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
              <h3 style={{margin:0,fontSize:15}}>Team feedback on breed data ({feedback.length})</h3>
              {feedback.length>0 && <button onClick={()=>exportJSON(feedback,"huft-fit-feedback.json")} style={{border:"1px solid #C3C6D4",background:"#fff",borderRadius:7,padding:"5px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:600,color:"#565A6E"}}>Export JSON</button>}
            </div>
            <p style={{fontSize:12.5,color:"#676879",margin:"6px 0 0"}}>Every rating submitted from the Knowledge base appears here. Export and share the JSON to consolidate team review — this is the pipeline for upgrading C-tier estimates to A-tier fit-lab data.</p>
          </section>
          {feedback.length===0 ? (
            <section style={{...card,textAlign:"center",padding:36}}>
              <div style={{fontSize:34}}>📝</div>
              <h3 style={{margin:"8px 0 4px"}}>No feedback yet</h3>
              <p style={{color:"#676879",fontSize:13.5,margin:0}}>Open any breed in the library and tap "Rate this data" to log whether the numbers match reality.</p>
            </section>
          ) : [...feedback].reverse().map(f=>(
            <div key={f.id} style={{...card,padding:"12px 14px",borderLeft:`4px solid ${f.verdict==="good"?"#00A25B":"#E2445C"}`}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:8,flexWrap:"wrap",fontSize:13}}>
                <span><b>{f.breed}</b> · {f.field} · <span style={{color:f.verdict==="good"?"#00A25B":"#E2445C",fontWeight:700}}>{f.verdict==="good"?"✓ good":"✗ needs fix"}</span></span>
                <span style={{...MONO,fontSize:11.5,color:"#9699A6"}}>{f.author} · {f.ts.slice(0,16).replace("T"," ")}</span>
              </div>
              {f.text && <p style={{margin:"6px 0 0",fontSize:13,color:"#40434E"}}>{f.text}</p>}
            </div>
          ))}
        </>}

        <footer style={{marginTop:20,fontSize:11.5,color:"#9699A6",lineHeight:1.6}}>
          Confidence tiers — <b>A</b>: published standard or measured study (±2–3 cm) · <b>B</b>: aggregated manufacturer sizing charts (±4–6 cm) · <b>C</b>: estimated from build, pending HUFT fit-lab measurement (±8 cm+). Chest girths for 41 of 50 breeds are now B/A, cross-checked against AKC-standard girth bands (The Artful Canine); the remaining C-tier are mostly native breeds with no published girth data — only HUFT fit-lab measurement can raise these to A. Indian lines often run heavier than international standards. Hover any A/B/C badge for what it means. Data is stored in this browser (localStorage); export JSON to consolidate. â = demand rank from HUFT’s actual 2-year retail sales (393k+ units). Product sizes come from your catalog; ask the engine which breeds each SKU fits.
        </footer>
      </div>
      </div>
      <AskWidget open={askOpen} onToggle={()=>setAskOpen(o=>!o)} all={ALL}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate/>);

   table (feedback: id, breed, verdict, field, text, author, ts;
   products: id, name, type, neck_min/max, chest_min/max, width)
   and lift setState into .then() — the rest of the app is
   storage-agnostic.
   ============================================================ */
</script>
</body>
</html>
