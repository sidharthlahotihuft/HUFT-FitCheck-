/* ---- What a size actually measures, per product type ----------------------
   Odoo publishes only "Length" for all body apparel. The raincoat spec decks
   are the one source with back + girth + neck per size. So girth and neck for
   the other apparel are DERIVED from the dog's own measurement, using ratios
   calibrated on the 13 sales-confirmed raincoat breeds:
     garment girth = 1.25 x dog chest   (median across breeds, range 1.16–1.48)
     garment neck  = 1.24 x dog neck    (median across breeds, range 1.19–1.57)
   Anything derived is labelled "est" in the UI so the data gap stays visible. */
const DIMS = {'Raincoat':['back','girth','neck'],'T-Shirt':['back','girth','neck'],'Sweater':['back','girth','neck'],'Sweatshirt':['back','girth','neck'],'Jacket':['back','girth','neck'],'Kurta':['back','girth','neck'],'Sherwani':['back','girth','neck'],'Shirt':['back','girth','neck'],'Collar':['neck'],'Collar & Leash':['neck'],'Harness':['girth','neck']};
const RATIO_DEFAULT = {girth:1.25, neck:1.24};
const DIM_DOG = {back:'body', girth:'chest', neck:'neck'};
const DIM_OF_EASE = {body:'back', neck:'neck', chest:'girth'};

/* Returns [{d, cm, src}] for one product at one size. src: "spec" = published
   in the catalog/deck, "est" = derived from dog dimension + ease/ratio. */
function garmentDims(p, size, b, easeAdj, ratioAdj){
  if(!b) return [];
  const dims = DIMS[p] || ['back'];
  const primary = DIM_OF_EASE[EASE_DIM[p]];
  const lad = (LADDER[p]||[]).find(x=>x[0]===size);
  const dogOf = d => d==='back' ? ((b.care&&b.care.bodyLen)||b.height) : d==='girth' ? b.chest : b.neck;
  return dims.map(d=>{
    if(d===primary && lad) return {d, cm:lad[1], src:'spec'};
    const dd = dogOf(d); if(!dd) return null;
    const mid = (dd[0]+dd[1])/2;
    if(d==='back'){
      const e = (easeAdj&&easeAdj[p]!=null) ? Number(easeAdj[p]) : EASE_DEFAULT[p];
      return {d, cm: mid + (e||0), src:'est'};
    }
    const r = (ratioAdj&&ratioAdj[p]&&ratioAdj[p][d]!=null) ? Number(ratioAdj[p][d]) : RATIO_DEFAULT[d];
    return {d, cm: mid * (r||1), src:'est'};
  }).filter(Boolean);
}

   Picks the best size per model against the dog's back + ease. */
function raincoatPerModel(b, easeAdj){
  if(!b || typeof RAINCOAT_MODELS==='undefined') return [];
  const bl = (b.care&&b.care.bodyLen) || b.height; if(!bl) return [];
  const e = (easeAdj&&easeAdj['Raincoat']!=null) ? Number(easeAdj['Raincoat']) : EASE_DEFAULT['Raincoat'];
  const target = (bl[0]+bl[1])/2 + (e||0);
  return Object.keys(RAINCOAT_MODELS).map(name=>{
    const m = RAINCOAT_MODELS[name];
    let bi=0; m.back.forEach((v,i)=>{ if(Math.abs(v-target) < Math.abs(m.back[bi]-target)) bi=i; });
    return {name, size:m.sizes[bi], back:m.back[bi], girth:m.girth[bi], neck:m.neck[bi],
            max: bi===m.sizes.length-1 && m.back[bi] < target, min: bi===0 && m.back[bi] > target};
  });
}

function overlapPct(breed, prod){ const lo=Math.max(breed[0],prod[0]), hi=Math.min(breed[1],prod[1]); return hi<=lo?0:(hi-lo)/(breed[1]-breed[0]); }
function gradeOf(p){ return p>=0.9?"full":p>=0.55?"good":p>0?"partial":"none"; }

function widthAdvice(nMax){ return nMax<=30?"1–1.5 cm webbing":nMax<=45?"1.5–2.5 cm webbing":nMax<=60?"2.5–3.8 cm webbing":"3.8–5 cm webbing"; }
function pullHardware(p){ return p>=5?"Load-rated metal hardware, bar-tack + box-X stitching, ≥3.8 cm web":p>=4?"Metal D-rings, bar-tack stitching, ≥2.5 cm web":p>=3?"Quality acetal or metal hardware, reinforced joins":"Standard hardware acceptable"; }

function TapeBar({breedRange,prodRange,domain}){
  const [dLo,dHi]=domain, span=dHi-dLo, pct=v=>Math.max(0,Math.min(100,((v-dLo)/span)*100));
  const bLo=pct(breedRange[0]),bHi=pct(breedRange[1]),pLo=pct(prodRange[0]),pHi=pct(prodRange[1]);
  const oLo=Math.max(bLo,pLo),oHi=Math.min(bHi,pHi);
  const hasOverlap=oHi>oLo;
  return (
    <div>
      <div style={{position:"relative",height:24,borderRadius:6,background:"#F0F1F6",border:"1px solid #E6E9EF"}}>
        {/* tick marks every ~10% */}

        {/* product range bar */}
        <div style={{position:"absolute",top:7,bottom:7,left:pLo+"%",width:Math.max(0.8,pHi-pLo)+"%",background:"#FFC299",borderRadius:3}}/>
        {/* overlap */}
        {hasOverlap && <div style={{position:"absolute",top:7,bottom:7,left:oLo+"%",width:(oHi-oLo)+"%",background:"#00A25B",borderRadius:3}}/>}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:"#9699A6",marginTop:2,fontFamily:"'IBM Plex Mono', ui-monospace, monospace"}}>
        <span>{dLo} cm</span><span>{dHi} cm</span>
      </div>
    </div>
  ); }

            <div style={{flex:"1 1 100%",fontSize:12,color:"#40434E",lineHeight:1.55}}>

              {care.skin>=4 && "Sensitive skin — soft padded linings, colourfast dyes, no rough edges. "}
              {care.groom>=4 && "High-grooming coat — snag-free hardware, rolled edges. "}
              {care.shed<4 && care.drool<4 && care.skin<4 && care.groom<4 && "No special material constraints from coat or skin."}
            </div>
          </div>
        </details>
        <details style={{marginTop:10}}>
          <summary style={{fontSize:12.5,fontWeight:700,color:"#323338"}}>Regional demand & climate</summary>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:8,alignItems:"flex-end"}}>
            {Object.values(REGIONS).map(r=>(
              <div key={r.key} title={r.cities} style={{flex:1,minWidth:70,cursor:"help"}}>
                <div style={{fontSize:10,color:"#9699A6",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:3}}>{r.label} <b style={{color:b.regions[r.key]===0?"#E2445C":"#323338"}}>{b.regions[r.key]}/5</b></div>
                <div style={{display:"flex",gap:2}}>{[1,2,3,4,5].map(i=><div key={i} style={{flex:1,height:5,borderRadius:3,background:i<=b.regions[r.key]?"#F6C445":"#E6E9EF"}}/>)}</div>
              </div>
            ))}
            <Chip text={heatInfo(b.heat).label} tip={heatInfo(b.heat).tip} tone={heatInfo(b.heat).warn?"warn":"info"}/>
          </div>
        </details>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:10}}>
          <Chip text={b.coat} tone="info"/>
          <Chip text={b.growth} tone="info"/>
          <Chip text={widthAdvice(b.neck[1])} tone="info"/>
          {b.flags.map(f=><Chip key={f} text={FLAG_LABELS[f].label} tip={FLAG_LABELS[f].tip} tone="warn"/>)}
        </div>
        <p style={{fontSize:13,color:"#40434E",margin:"9px 0 0",lineHeight:1.5}}>{b.notes}</p>
        <details style={{marginTop:8}}>
          <summary style={{fontSize:12,color:"#565A6E",fontWeight:600,display:"inline-flex",alignItems:"center",gap:5}}>
            <span style={{display:"inline-block",width:16,height:16,borderRadius:4,background:"#F0F1F6",textAlign:"center",lineHeight:"16px",fontSize:10}}>ⓘ</span> Sources & confidence
          </summary>
          <ul style={{margin:"6px 0 0",paddingLeft:18,fontSize:12,color:"#676879",lineHeight:1.6}}>
            {b.src.map((s,i)=><li key={i}>{s}</li>)}
            <li style={MONO}>Tiers: A ±2–3 cm · B ±4–6 cm · C ±8 cm+ (validate in fit lab). Body length & care scores are estimates.</li>
          </ul>
        </details>
        <FeedbackBox breed={b} feedback={feedback} onAdd={onAddFeedback}/>
      </div>}
    </div>
  );
}

/* ---------- Ask HUFT Fit: rule-based answer engine over the data ---------- */
const CITY_ZONE = {delhi:"n",gurgaon:"n",gurugram:"n",noida:"n",ncr:"n",jaipur:"n",lucknow:"n",chandigarh:"n","tri-city":"n",north:"n",
  mumbai:"w",pune:"w",ahmedabad:"w",surat:"w",gujarat:"w",west:"w",
  bangalore:"s",bengaluru:"s",chennai:"s",hyderabad:"s",kochi:"s",south:"s",
  kolkata:"e",guwahati:"e",east:"e"};
const ALIASES = {lab:"Labrador Retriever",labrador:"Labrador Retriever",golden:"Golden Retriever",gsd:"German Shepherd","german shepherd":"German Shepherd",alsatian:"German Shepherd",
  indie:"Indian Pariah (Indie)",pariah:"Indian Pariah (Indie)","desi dog":"Indian Pariah (Indie)",pom:"Pomeranian",frenchie:"French Bulldog",
  "shih tzu":"Shih Tzu",shihtzu:"Shih Tzu",husky:"Siberian Husky",rott:"Rottweiler",rottweiler:"Rottweiler",doberman:"Doberman",dobermann:"Doberman",
  mudhol:"Mudhol / Caravan Hound",caravan:"Mudhol / Caravan Hound",dane:"Great Dane",saint:"Saint Bernard","st bernard":"Saint Bernard",
  pitbull:"Amstaff / Pit-type","pit bull":"Amstaff / Pit-type",amstaff:"Amstaff / Pit-type",gaddi:"Himalayan Sheepdog (Gaddi)","bully kutta":"Bully Kutta (Indian Mastiff)",
  dachshund:"Dachshund (Standard)",sausage:"Dachshund (Standard)",corgi:"Pembroke Corgi",bulldog:"English Bulldog",spitz:"Indian Spitz",poodle:"Standard Poodle",
  malamute:"Alaskan Malamute",basset:"Basset Hound","tibetan mastiff":"Tibetan Mastiff",bullmastiff:"Bullmastiff",banjara:"Banjara Hound",vanjari:"Banjara Hound"};

function findBreeds(q, all){
  const found=[]; const ql=" "+q.toLowerCase()+" ";
  const entries=Object.entries(ALIASES).sort((a,z)=>z[0].length-a[0].length);
  for(const [alias,full] of entries){ if(ql.includes(alias)){ const b=all.find(x=>x.name===full); if(b && !found.includes(b)) found.push(b); } }
  for(const b of all){ const parts=[b.name.toLowerCase(),b.name.toLowerCase().split(" (")[0],b.name.toLowerCase().split(" /")[0]];
    if(parts.some(p=>p.length>3 && ql.includes(p)) && !found.includes(b)) found.push(b); }
  return found.slice(0,2);
}
const confNote = t => t==="A"?"confidence A, ±2–3 cm":t==="B"?"confidence B, ±4–6 cm":"confidence C — estimate, validate in fit lab";

/* ---------- product ↔ breed fit engine ---------- */
function bestVariantForBreed(sku, b){
  // apparel is sized by garment back-length, not neck/chest girth
  if(sku.type==="apparel"){
    const bodyLen = (b.care && b.care.bodyLen) || b.height;
    let best=null;
    sku.variants.forEach(v=>{
      const lOv = overlapPct(bodyLen,[v.lengthMin,v.lengthMax]);
      if(!best || lOv>best.score) best={variant:v,score:lOv,cOv:lOv,nOv:1};
    });
    return best;
  }
  // score each variant by combined neck+chest overlap; return best
  let best=null;
  sku.variants.forEach(v=>{
    const nOv = v.neckMin!=null ? overlapPct(b.neck,[v.neckMin,v.neckMax]) : 1;
    const cOv = overlapPct(b.chest,[v.chestMin,v.chestMax]);
    const wOv = (v.weightMin!=null) ? overlapPct(b.weight,[v.weightMin,v.weightMax]) : 1;
    const score = Math.min(cOv, nOv)*0.7 + wOv*0.3;
    if(!best || score>best.score) best={variant:v,score,cOv,nOv};
  });
  return best;
}
// Best-fitting catalog size of a specific product for one breed (used in "By product" mode).
function bestSizeForBreed(product, b, ptype){
  if(!product || !product.variants || !product.variants.length) return null;
  const bodyLen=(b.care&&b.care.bodyLen)||b.height;
  const fmtR=r=>!r?"":(Math.round(r[0])===Math.round(r[1])?`${Math.round(r[0])} cm`:`${Math.round(r[0])}–${Math.round(r[1])} cm`);
  let best=null;
  product.variants.forEach(v=>{
    const d=dimsOfVariant(product,v);
    let score,cm,m;
    if(ptype==="apparel"){ if(!d.length) return; score=overlapPct(bodyLen,d.length); cm=fmtR(d.length); m="back"; }
    else if(ptype==="harness"){ if(!d.chest) return; const n=d.neck?overlapPct(b.neck,d.neck):1; score=Math.min(n,overlapPct(b.chest,d.chest)); cm=fmtR(d.chest); m="girth"; }
    else { if(!d.neck) return; score=overlapPct(b.neck,d.neck); cm=fmtR(d.neck); m="neck"; }
    if(best===null||score>best.score) best={size:v.size,score,cm,m};
  });
  return best && best.score>0 ? best : null;
}
// Raincoat models carry full back/girth/neck per size from the PPT decks; match a product name to its model.
function raincoatModelFor(name){
  if(!name || typeof RAINCOAT_MODELS==="undefined") return null;
  const n=name.toLowerCase();
  for(const kv of RAINCOAT_MATCH){ if(n.includes(kv[0])) return Object.assign({name:kv[1]}, RAINCOAT_MODELS[kv[1]]); }
  return null;
}
// ptype from a catalog subCategory, for fit maths on non-raincoat products.
function ptypeOfSub(sub){ if(!sub) return "apparel"; const s=sub.toLowerCase();
  if(s.includes("harness")) return "harness"; if(s.includes("collar")||s.includes("leash")) return "collar"; return "apparel"; }
// Build a per-size dimension chart for any catalog product from its parsed variant dims.
function productChart(product){
  const labels=[], seen={};
  (product.variants||[]).forEach(v=>(v.dimParsed||[]).forEach(d=>{ if(!seen[d.label]){seen[d.label]=1; labels.push(d.label);} }));
  const sizes=(product.variants||[]).map(v=>v.size), data={};
  (product.variants||[]).forEach(v=>{ const row={}; (v.dimParsed||[]).forEach(d=>{ row[d.label]= (d.value===d.valueMax?`${d.value}`:`${d.value}–${d.valueMax}`)+(d.unit?` ${d.unit}`:""); }); data[v.size]=row; });
  return {sizes, labels, data};
}
function analyzeSku(sku, all){
  const excluded=[], fits={};
  sku.variants.forEach(v=>fits[v.size]=[]);
  all.forEach(b=>{
    const isExcluded = (sku.excludeGroups||[]).includes(b.group) || (sku.excludeGroups||[]).includes(b.hbucket);
    const bv=bestVariantForBreed(sku,b);
    if(isExcluded || !bv || bv.score<0.15){ excluded.push(b); return; }
    fits[bv.variant.size].push({b,score:bv.score});
  });
  Object.keys(fits).forEach(k=>fits[k].sort((x,y)=> (y.b.sales||0)-(x.b.sales||0) || y.score-x.score));
  return {fits,excluded};
}
function skuAnswer(sku, all){
  const {fits,excluded}=analyzeSku(sku,all);
  const sizes=sku.variants.map(v=>v.size);
  const L=[];
  L.push(`**${sku.name}** — ${sizes.length} sizes: ${sizes.join(", ")}`);
  if(sku.notes) L.push(sku.notes);
  L.push(``);
  // excluded summary
  const exNamed=excluded.filter(b=>b.pop>=3 || (b.sales||0)>800).slice(0,6).map(b=>b.name);
  if(sku.type!=="apparel" && (sku.positioning==="functional" || sku.pullFocus))
    L.push(`As a functional${sku.pullFocus?" no-pull":""} product it suits most breeds but is **not ideal for X-Small / toy breeds**${exNamed.length?` — e.g. ${exNamed.join(", ")}`:""}.`);
  L.push(``);
  // per-variant recommendation in the requested style
  sku.variants.forEach(v=>{
    const list=fits[v.size]||[];
    if(!list.length){ L.push(`**${v.size}** — no strong breed match in the database.`); return; }
    const lead=list.slice(0,3).map(x=>x.b.name).join(", ");
    if(sku.type==="apparel"){
      const hi = v.lengthMax>=999?"+":`–${v.lengthMax}`;
      L.push(`**${v.size}** — best for ${lead}${list.length>3?` (+${list.length-3} more)`:""}. Garment back-length ~${v.garmentLength??"—"} cm, fits body length ${v.lengthMin}${hi} cm.`);
      return;
    }
    const wt = v.weightMin!=null?`${v.weightMin}–${v.weightMax} kg`:"—";
    L.push(`**${v.size}** — best for ${lead}${list.length>3?` (+${list.length-3} more)`:""}. Typical dog: ~${wt}, neck ${v.neckMin}–${v.neckMax} cm, chest ${v.chestMin}–${v.chestMax} cm${v.lengthMin!=null?`, back length ${v.lengthMin}–${v.lengthMax} cm`:""}.`);
  });
  L.push(``);
  if(sku.pullFocus) L.push(`Best suited to dogs that pull strongly — front-clip control point and load-rated hardware. For calm toy breeds, a soft back-clip harness is the better call.`);
  L.push(sku.type==="apparel"
    ? `_Body length is estimated for every breed (confidence capped at B) — no breed has been field-measured for length yet. Treat sizing as a starting point, not a guarantee; individual garments vary ±a size._`
    : `_Sizes reflect ${sku.name} variant dimensions; breed girths carry their own A/B/C confidence. Validate borderline dogs in the fit lab._`);
  return L.join("\n");
}

function answerQuestion(q, all){
  const ql=q.toLowerCase();
  const breeds=findBreeds(q, all);
  // product/SKU questions — check catalog names against query
  const skuList = (typeof window!=="undefined" && window.__HUFT_SKUS__) || SEED_SKUS;
  const skuHit = skuList.find(sk=>{ const n=sk.name.toLowerCase(); const key=n.replace("huft ","").replace(" harness","").replace(" collar","").split(" ")[0];
    return ql.includes(n) || ql.includes(key); });
  if(skuHit && (ql.includes("fit")||ql.includes("size")||ql.includes("breed")||ql.includes("which")||ql.includes(skuHit.name.toLowerCase().split(" ")[1]||"xplorer"))) return skuAnswer(skuHit, all);

  const has=w=>ql.includes(w);
  const zoneWord=Object.keys(CITY_ZONE).find(c=>ql.includes(c));
  const nums=(ql.match(/(\d+(?:\.\d+)?)\s*(?:–|-|to)\s*(\d+(?:\.\d+)?)/)||[]).slice(1,3).map(Number);
  const L=[];

  if(breeds.length===2){
    const [a,b]=breeds;
    L.push(`**${a.name} vs ${b.name}**`);
    L.push(`• Neck: ${a.neck[0]}–${a.neck[1]} cm (${a.conf.neck}) vs ${b.neck[0]}–${b.neck[1]} cm (${b.conf.neck})`);
    L.push(`• Chest: ${a.chest[0]}–${a.chest[1]} cm (${a.conf.chest}) vs ${b.chest[0]}–${b.chest[1]} cm (${b.conf.chest})`);
    L.push(`• Weight: ${a.weight[0]}–${a.weight[1]} kg vs ${b.weight[0]}–${b.weight[1]} kg`);
    L.push(`• Pull: ${a.beh.pull}/5 vs ${b.beh.pull}/5 · Escape: ${a.beh.escape}/5 vs ${b.beh.escape}/5 · Heat: ${a.heat}/5 vs ${b.heat}/5`);
    L.push(`• Gear: ${a.name} → ${a.beh.clip}; ${b.name} → ${b.beh.clip}`);
    return L.join("\n");
  }

  if(breeds.length===1){
    const b=breeds[0]; const care=b.care||{};
    if(has("collar")){
      L.push(`**Collar for ${b.name}**`);
      L.push(`• Adult neck girth: ${b.neck[0]}–${b.neck[1]} cm (${confNote(b.conf.neck)}). Add ~2 cm wearing ease.`);
      L.push(`• Webbing: ${widthAdvice(b.neck[1])}.`);
      if(b.flags.includes("brachy")) L.push(`• ⚠ Brachycephalic — collar for ID tags only; walks on a harness.`);
      if(b.flags.includes("slipRisk")) L.push(`• ⚠ Slip risk — head narrower than neck; flat collars slip. Use a martingale.`);
      if(b.beh.pull>=4) L.push(`• Strong puller (${b.beh.pull}/5): ${pullHardware(b.beh.pull)}.`);
      return L.join("\n");
    }
    if(has("harness")){
      L.push(`**Harness for ${b.name}**`);
      L.push(`• Neck: ${b.neck[0]}–${b.neck[1]} cm (${b.conf.neck}) · Chest: ${b.chest[0]}–${b.chest[1]} cm (${confNote(b.conf.chest)}).`);
      L.push(`• Recommended: ${b.beh.clip}. Pull ${b.beh.pull}/5 · escape ${b.beh.escape}/5.`);
      L.push(`• Hardware: ${pullHardware(b.beh.pull)}.`);
      if(b.flags.includes("deepChest")) L.push(`• Deep chest — girth strap migrates; keep it near the elbow with a Y-front.`);
      if(b.flags.includes("coatLoft")) L.push(`• Coat loft adds 2–5 cm apparent girth — size on compressed measurement.`);
      return L.join("\n");
    }
    if(has("pull")||has("leash")){
      L.push(`**${b.name} on leash**`);
      L.push(`• Pull ${b.beh.pull}/5 · energy ${b.beh.energy}/5 · escape ${b.beh.escape}/5.`);
      L.push(`• Gear: ${b.beh.clip}. Hardware: ${pullHardware(b.beh.pull)}.`);
      return L.join("\n");
    }
    if(has("shed")||has("groom")||has("coat")||has("drool")||has("skin")){
      L.push(`**${b.name} — coat & materials**`);
      L.push(`• Coat: ${b.coat}. Shedding ${care.shed}/5 · grooming ${care.groom}/5 · drool ${care.drool}/5 · skin sensitivity ${care.skin}/5.`);
      if(care.skin>=4) L.push(`• Sensitive skin — soft linings, colourfast dyes, no rough edges.`);
      if(care.shed>=4) L.push(`• High shed — avoid velcro and plush linings that trap fur.`);
      if(care.drool>=4) L.push(`• Heavy drool — quick-dry, stain-resistant webbing.`);
      return L.join("\n");
    }
    if(has("heat")||has("summer")||has("hot")||has("climate")){
      L.push(`**${b.name} in Indian heat**`);
      L.push(`• ${heatInfo(b.heat).label}. ${heatInfo(b.heat).tip}`);
      return L.join("\n");
    }
    if(has("region")||has("where")||zoneWord){
      L.push(`**${b.name} — regional demand**`);
      Object.values(REGIONS).forEach(r=>L.push(`• ${r.label} (${r.cities}): ${b.regions[r.key]}/5`));
      return L.join("\n");
    }
    L.push(`**${b.name}** (${b.group}${b.huft?", HUFT priority breed":""})`);
    L.push(`• Neck ${b.neck[0]}–${b.neck[1]} cm (${b.conf.neck}) · Chest ${b.chest[0]}–${b.chest[1]} cm (${b.conf.chest}) · ${b.weight[0]}–${b.weight[1]} kg · ${b.height[0]}–${b.height[1]} cm tall`);
    L.push(`• Behaviour: pull ${b.beh.pull}/5, escape ${b.beh.escape}/5 → ${b.beh.clip}`);
    L.push(`• Heat ${b.heat}/5 · demand N${b.regions.n} W${b.regions.w} S${b.regions.s} E${b.regions.e} · lifespan ${care.life?care.life[0]+"–"+care.life[1]+" yrs":"n/a"}`);
    L.push(`• ${b.notes}`);
    return L.join("\n");
  }

  if(nums.length===2 && (has("neck")||has("chest")||has("collar")||has("harness")||has("fit"))){
    const dim=has("chest")?"chest":"neck";
    const [lo,hi]=nums;
    const fits=all.map(b=>({b,pct:overlapPct(b[dim],[lo,hi])})).filter(x=>x.pct>0).sort((a,z)=>z.pct-a.pct||z.b.pop-a.b.pop);
    const full=fits.filter(x=>x.pct>=0.9), good=fits.filter(x=>x.pct>=0.55&&x.pct<0.9);
    L.push(`**${dim==="neck"?"Neck":"Chest"} range ${lo}–${hi} cm covers:**`);
    L.push(`• Full fit (${full.length}): ${full.slice(0,10).map(x=>x.b.name).join(", ")||"none"}${full.length>10?"…":""}`);
    L.push(`• Good fit (${good.length}): ${good.slice(0,8).map(x=>x.b.name).join(", ")||"none"}${good.length>8?"…":""}`);
    L.push(`Open the Fit checker to see tape-bar overlap per breed and the second dimension.`);
    return L.join("\n");
  }

  if(zoneWord){
    const z=CITY_ZONE[zoneWord]; const r=REGIONS[z];
    const ranked=[...all].filter(b=>b.regions[z]>0).sort((a,x)=>x.regions[z]-a.regions[z]||x.pop-a.pop).slice(0,8);
    L.push(`**Top breeds — ${r.label} zone** (${r.cities}):`);
    ranked.forEach(b=>L.push(`• ${b.name} — ${b.regions[z]}/5 · neck ${b.neck[0]}–${b.neck[1]}, chest ${b.chest[0]}–${b.chest[1]} cm`));
    L.push(`Zone demand is indicative — swap in ERP sales data for ground truth.`);
    return L.join("\n");
  }

  if(has("pull")){ const t=[...all].sort((a,z)=>z.beh.pull-a.beh.pull).slice(0,8);
    return ["**Strongest pullers** (hardware-critical):",...t.map(b=>`• ${b.name} — pull ${b.beh.pull}/5, ${pullHardware(b.beh.pull)}`)].join("\n"); }
  if(has("escape")||has("slip")||has("martingale")){ const t=all.filter(b=>b.beh.escape>=4||b.flags.includes("slipRisk"));
    return ["**Slip-risk / escape-artist breeds** (martingale or 3-strap):",...t.map(b=>`• ${b.name} — escape ${b.beh.escape}/5`)].join("\n"); }
  if(has("heat")||has("summer")){ const t=all.filter(b=>b.heat>=4&&b.pop>=3), w=all.filter(b=>b.heat<=2&&b.pop>=3);
    return [`**Heat-tolerant high-demand breeds:** ${t.map(b=>b.name).join(", ")}`,``,`**Heat-sensitive but popular** (mesh-only builds): ${w.map(b=>b.name).join(", ")}`].join("\n"); }
  if(has("brachy")||has("flat face")){ const t=all.filter(b=>b.flags.includes("brachy"));
    return ["**Brachycephalic breeds** (harness-only for walks):",...t.map(b=>`• ${b.name} — neck ${b.neck[0]}–${b.neck[1]}, chest ${b.chest[0]}–${b.chest[1]} cm`)].join("\n"); }
  if(has("native")||has("indian breed")||has("desi")){ const t=all.filter(b=>b.group==="Native");
    return [`**Native Indian breeds in the database (${t.length}):**`,...t.map(b=>`• ${b.name} — chest ${b.chest[0]}–${b.chest[1]} cm (${b.conf.chest}) · ${b.beh.clip}`)].join("\n"); }
  if(has("popular")||has("top")||has("priority")||has("best")){ const t=[...all].sort((a,z)=>z.pop-a.pop).slice(0,10);
    return ["**Highest India demand:**",...t.map(b=>`• ${b.name} ${"★".repeat(b.pop)}${b.huft?" · HUFT SIX":""}`)].join("\n"); }

  return ["I answer from the breed database. Try:",
    `• "What size collar for a Beagle?"`,
    `• "Harness for an Indie"`,
    `• "Which breeds fit neck 30-45?"`,
    `• "Top breeds in Delhi" or "South zone"`,
    `• "Compare Labrador and Golden"`,
    `• "Strongest pullers" · "Slip-risk breeds" · "Native breeds"`].join("\n");
}

/* ---------- Products tab ---------- */
const KEY_CUSTOM_PRODUCTS = "huft_fit_custom_products";

function curatedSkuToProduct(sk){
  // 999 is our "open-ended" sentinel for the top apparel size (82 cm+) — cap it
  // to a realistic ceiling for aggregation/display instead of letting it stand as 999.
  const capLen = m => m>=999 ? 95 : m;
  const agg = sk.type==="apparel"
    ? { neck:null, chest:null, length:[Math.min(...sk.variants.map(v=>v.lengthMin)), Math.max(...sk.variants.map(v=>capLen(v.lengthMax)))] }
    : { neck:[Math.min(...sk.variants.map(v=>v.neckMin)), Math.max(...sk.variants.map(v=>v.neckMax))],
        chest: sk.type==="harness" ? [Math.min(...sk.variants.map(v=>v.chestMin)), Math.max(...sk.variants.map(v=>v.chestMax))] : null,
        length:null };
  return {
    name: sk.name,
    category: sk.type==="apparel" ? "Clothing" : "Collars, Leashes & Harnesses",
    subCategory: sk.type==="apparel" ? "Apparel (auto-sized)" : sk.type==="harness" ? "Harness" : "Collar",
    petType: "Dog",
    collection: null,
    season: null,
    image: null,
    url: sk.url,
    fitMatched: true,
    agg,
    variants: sk.variants.map(v=>({
      size: v.size,
      sku: sk.id+"-"+v.size,
      dimension: sk.type==="apparel"
        ? (v.lengthMax>=999 ? `Body length ${v.lengthMin}+ cm` : `Body length ${v.lengthMin}–${v.lengthMax} cm`)
        : `Neck ${v.neckMin??"–"}–${v.neckMax??"–"} cm · Chest ${v.chestMin}–${v.chestMax} cm`,
      // raw structured per-size measurements, so the Fit Checker can load a single
      // size's dims instead of the whole product's flattened min/max aggregate.
      raw: sk.type==="apparel"
        ? {lengthMin:v.lengthMin, lengthMax:capLen(v.lengthMax)}
        : {neckMin:v.neckMin, neckMax:v.neckMax, chestMin:sk.type==="harness"?v.chestMin:null, chestMax:sk.type==="harness"?v.chestMax:null},
    })),
  };
}

/* Aggregate a catalog product's variants into overall neck/chest/length ranges
   for the Fit Checker. Curated SKUs carry a precomputed `agg`; Odoo products are
   derived from each variant's parsed Dimension text (label-matched, so a
   Leash's "Length" is never mistaken for a Clothing item's body length). */
// Dims for a single variant (one size) of a product — used both to build the
// whole-product aggregate below and to let the Fit Checker load just one size.
// Any parsed attribute that isn't neck/girth/clothing-length still matters —
// e.g. a leash's own "Length", or a collar's "Width" — so it's kept as `extra`
// instead of being silently dropped, for other variants that carry multiple
// distinct attributes.
function dimsOfVariant(product, v){
  if(!v) return {neck:null,chest:null,length:null,extra:[]};
  if(v.raw){
    const r=v.raw;
    return {
      neck: r.neckMin!=null ? [r.neckMin, r.neckMax] : null,
      chest: r.chestMin!=null ? [r.chestMin, r.chestMax] : null,
      length: r.lengthMin!=null ? [r.lengthMin, r.lengthMax] : null,
      extra: [],
    };
  }
  const neck=[], chest=[], length=[]; const extraMap={};
  (v.dimParsed||[]).forEach(d=>{
    const lbl=(d.label||"").toLowerCase();
    const lo=d.value, hi=(d.valueMax!=null?d.valueMax:d.value);
    if(lbl.includes("neck")){ neck.push(lo); neck.push(hi); }
    else if(lbl.includes("girth")){ chest.push(lo); chest.push(hi); }
    else if(lbl==="length" && product.category==="Clothing"){ length.push(lo); length.push(hi); }
    else {
      const key=d.label||"Attribute";
      (extraMap[key]=extraMap[key]||[]).push(lo, hi);
    }
  });
  const extra=Object.entries(extraMap).map(([label,vals])=>({label, range:[Math.min(...vals),Math.max(...vals)]}));
  return {
    neck: neck.length?[Math.min(...neck),Math.max(...neck)]:null,
    chest: chest.length?[Math.min(...chest),Math.max(...chest)]:null,
    length: length.length?[Math.min(...length),Math.max(...length)]:null,
    extra,
  };
}

function aggregateDims(product, variant){
  if(!product) return {neck:null,chest:null,length:null,extra:[]};
  if(variant) return dimsOfVariant(product, variant);
  if(product.agg) return {extra:[], ...product.agg};
  const neck=[], chest=[], length=[]; const extraMap={};
  (product.variants||[]).forEach(v=>{
    const d=dimsOfVariant(product,v);
    if(d.neck){ neck.push(d.neck[0]); neck.push(d.neck[1]); }
    if(d.chest){ chest.push(d.chest[0]); chest.push(d.chest[1]); }
    if(d.length){ length.push(d.length[0]); length.push(d.length[1]); }
    (d.extra||[]).forEach(e=>{ (extraMap[e.label]=extraMap[e.label]||[]).push(e.range[0], e.range[1]); });
  });
  const extra=Object.entries(extraMap).map(([label,vals])=>({label, range:[Math.min(...vals),Math.max(...vals)]}));
  return {
    neck: neck.length?[Math.min(...neck),Math.max(...neck)]:null,
    chest: chest.length?[Math.min(...chest),Math.max(...chest)]:null,
    length: length.length?[Math.min(...length),Math.max(...length)]:null,
    extra,
  };
}

function AskTab({all}){
  const [msgs,setMsgs]=useState([{role:"bot",text:"Hi! I'm the HUFT Fit engine. Ask me anything about the "+all.length+" breeds in the database — sizes, fit, behaviour, regions, materials. I answer only from the portal's data, with confidence tiers attached."}]);

    const q=(text!==undefined?text:input).trim(); if(!q) return;

/* ================= SIZE RECOMMENDATIONS (regenerated from sales + returns) ========= */
const S_MONO={fontFamily:"'IBM Plex Mono', ui-monospace, Menlo, monospace"};
function keepColour(k){ return k==null?"#9699A6" : k>=90?"#00A25B" : k>=85?"#C58A16" : "#D83A52"; }
/* A chart is either a deck size chart (flat arrays: back / girth / neck / bottom)
   or an Odoo gear chart (min-max ranges + strap / leash length). These two helpers
   are the only place that difference is handled. */
const DRIVER={neck:"neck",girth:"chest girth",back:"back length",strap:"strap width"};
const CAT_GROUPS={
  "Clothing":["Raincoat","Sweater","Sweatshirt","T-Shirt","Kurta","Shirt","Sherwani","Jacket","Dress"],
  "Collars, Leashes & Harnesses":["Collar","Leash","Harness","Leash & Harness","Collar & Leash"],
  "Accessories":["Bandana"]
};
function groupOfCat(c){ for(const g in CAT_GROUPS) if(CAT_GROUPS[g].includes(c)) return g; return "Other"; }
/* Which size each build takes. i is the size customers kept most, j is one step up.
   APPAREL leans large: 66% of recorded exchanges go up, and a garment that is
   slightly loose still works, while a tight one comes back.
   ADJUSTABLE GEAR does not: a collar or harness band has a hard lower limit, so
   sizing up on a small dog gives them something that cannot be pulled tight
   enough. Checked against the breed measurements — always taking the bigger size
   here would leave 59% of toy-breed gear rows physically unable to fit. */
const APPAREL_CATS = new Set(CAT_GROUPS["Clothing"]);
function buildSizes(cat,i,j){
  return APPAREL_CATS.has(cat) ? {lean:i, average:j, broad:j}
                               : {lean:i, average:i, broad:j};
}
/* REC_SALES.pair is the two candidate sizes for a breed, smallest first, and
   .base is the one customers kept most. base is OFTEN the larger of the two —
   so "the other size in the pair" is a size DOWN, not up. Never use it directly. */
const SIZE_LADDER=["2XS","XS","XS/S","S","S/M","M","M/L","L","L/XL","XL","XL/2XL","2XL","3XL","4XL","5XL","6XL","7XL"];
const SIZE_RANK={}; SIZE_LADDER.forEach((s,i)=>{SIZE_RANK[s]=i;});
function normSize(s){ return s==="XXS"?"2XS" : s==="XXL"?"2XL" : s; }
function rankOf(s){ const r=SIZE_RANK[normSize(s)]; return r==null?-1:r; }
function catLadder(cat){
  const set=new Set();
  Object.values((typeof PRODUCT_CHARTS==="undefined"?{}:PRODUCT_CHARTS)[cat]||{})
    .forEach(p=>(p.sizes||[]).forEach(z=>{ if(!z.includes("/")) set.add(normSize(z)); }));
  return [...set].filter(z=>rankOf(z)>=0).sort((a,b)=>rankOf(a)-rankOf(b));
}
/* The size a broad & sturdy dog should take. Prefer the pair when it genuinely
   points upward; otherwise step up the category's own ladder. */
/* Category-level version of buildSizes. Same rule: apparel leans large for an
   average dog, adjustable gear does not. */
function catBuilds(cat,r){
  const up=sizeUpFor(cat,r), bigger=up.size||r.base;
  return APPAREL_CATS.has(cat) ? {lean:r.base, average:bigger, broad:bigger}
                               : {lean:r.base, average:r.base, broad:bigger};
}
function sizeUpFor(cat,r){
  const up=(r.pair||[]).filter(z=>rankOf(z)>rankOf(r.base));
  if(up.length) return {size:up[0],note:""};
  const lad=catLadder(cat), i=lad.indexOf(normSize(r.base));
  if(i>=0 && i<lad.length-1) return {size:lad[i+1],note:""};
  if(i>=0) return {size:null,note:"largest size made"};
  return {size:null,note:"—"};
}
function chartVal(chart,k,i,unit){ return (chart&&chart[k]&&chart[k][i]!=null) ? chart[k][i]+" "+(unit||"cm") : null; }
function chartRng(chart,lo,hi,i){
  if(!chart||!chart[lo]||chart[lo][i]==null) return null;
  const a=chart[lo][i], b=chart[hi]?chart[hi][i]:null;
  return (b!=null&&b!==a) ? a+"–"+b+" cm" : a+" cm";
}
function chartDims(chart,i){
  if(!chart||i==null) return null;
  const one=(k,u)=>chartVal(chart,k,i,u), rng=(a,b)=>chartRng(chart,a,b,i);
  if(chart.src==="deck chart")
    return {"back":one("back"),"chest":one("girth"),"neck":one("neck"),"bottom":one("bottom")};
  return {"back":one("back"),"chest (adjusts)":rng("girthMin","girthMax"),
          "neck (adjusts)":rng("neckMin","neckMax"),
          "strap width":one("strap"),"leash length":one("leashLen")};
}
function chartCols(chart){
  if(!chart) return [];
  const one=k=>(i=>chartVal(chart,k,i)), rng=(a,b)=>(i=>chartRng(chart,a,b,i));
  const cols = chart.src==="deck chart"
    ? [["Back",one("back")],["Chest",one("girth")],["Neck",one("neck")],["Bottom",one("bottom")]]
    : [["Back",one("back")],["Chest (adjusts)",rng("girthMin","girthMax")],
       ["Neck (adjusts)",rng("neckMin","neckMax")],["Strap width",one("strap")],
       ["Leash length",one("leashLen")]];
  return cols.filter(([,f])=>chart.sizes.some((_,k)=>f(k)!=null));
}
function downloadCSV(rows,fname){
  const esc=v=>{ const t=v==null?"":String(v); return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
  const csv="\ufeff"+rows.map(r=>r.map(esc).join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  a.download=fname; a.click(); URL.revokeObjectURL(a.href);
}
/* ---- read the dog from a photo ---------------------------------------------
   The browser cannot identify a breed or judge a build — that needs a vision
   model, and a model needs an API key, which cannot sit in a page every customer
   downloads. So the photo goes to /api/build-from-photo (see api/build-from-photo.js),
   which holds the key server-side and returns {breed, build, note}.
   Deploy on Vercel and set OPENAI_API_KEY (or ANTHROPIC_API_KEY); nothing else changes.
   Either field can come back null — that means "not sure", and we ASK. We never
   guess: a wrong breed or a wrong build both ship a wrong size, which is the
   thing this tool exists to stop. */
const PHOTO_API = "/api/build-from-photo";
const MAX_PHOTO_PX = 1200;     // a 12MP phone photo is pointless here, and slow to upload

function shrink(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const scale=Math.min(1, MAX_PHOTO_PX/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      resolve({ data:c.toDataURL("image/jpeg",0.85).split(",")[1], mediaType:"image/jpeg" });
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("not an image")); };
    img.src=url;
  });
}

async function readDogPhoto(file,breeds){
  if(!PHOTO_API) return {ok:false,reason:"not-connected"};
  try{
    const {data,mediaType}=await shrink(file);
    const r=await fetch(PHOTO_API,{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({image:data,mediaType,breeds})});
    if(r.status===404 || r.status===405) return {ok:false,reason:"not-connected"};
    if(!r.ok) return {ok:false,reason:"error"};
    const j=await r.json();
    if(!j.breed && !j.build) return {ok:false,reason:"unclear",issue:j.photoIssue||null,hint:j.retryHint||""};
    return {ok:true,breed:j.breed||null,build:j.build||null,note:j.note||"",
            issue:j.photoIssue||null,hint:j.retryHint||""};
  }catch(e){ return {ok:false,reason:"error"}; }
}

          <div style={{fontWeight:700,fontSize:14,marginBottom:2}}>Full size chart — {prod}</div>
          <div style={{fontSize:11.5,color:"#9699A6",marginBottom:8}}>
            {chart.driver ? <>Sized on <b>{DRIVER[chart.driver]||chart.driver}</b>.</> : <>Sized on <b>back length</b>.</>} Measure your dog and check against the row we picked.
          </div>
          <div style={{overflowX:"auto"}}><table style={{borderCollapse:"collapse",fontSize:12.5,width:"100%"}}>
            <thead><tr>{["Size"].concat(chartCols(chart).map(c=>c[0])).map(h=>
              <th key={h} style={{textAlign:"left",padding:"6px 10px",borderBottom:"1.5px solid #E6E9EF",color:"#676879",fontWeight:600}}>{h}</th>)}</tr></thead>
            <tbody>{chart.sizes.map((sz,z)=>(
              <tr key={sz} style={{background:z===k?"#FEF1E5":"transparent"}}>
                <td style={{padding:"6px 10px",fontWeight:z===k?700:500}}>
                  {sz}{z===k?<span style={{fontSize:10,color:"#BA4511",fontWeight:700}}>  ← RECOMMENDED</span>:null}</td>
                {chartCols(chart).map(([h,f],y)=><td key={y} style={{...S_MONO,padding:"6px 10px",color:"#40434E"}}>{f(z)||"—"}</td>)}
              </tr>))}</tbody>
          </table></div>
        </section>
      </>);
    })()}
  </>);
}

/* ============ HUFT CATALOG — the internal view. Two ways in. ============
   1. by product: category → sub-category → every SKU, with breed recommendations + Excel export
   2. by breed:   breed → every category, with the sales verdict on whether a new size is needed */
function FitCatalogTab({onAsk}){
  const [mode,setMode]   = React.useState("product");
  const [grp,setGrp]     = React.useState("Clothing");
  const [sub,setSub]     = React.useState("Raincoat");
  const [pq,setPq]       = React.useState("");
  const [openP,setOpenP] = React.useState("");
  const [bFilter,setBFilter] = React.useState("All breeds");
  const [gFilter,setGFilter] = React.useState("All groups");
  const [breed,setBreed] = React.useState("Labrador Retriever");

  const allBreeds = Object.keys(BREED_FIT||{}).sort();
  /* Group comes from the breed knowledge base. Ten breeds carry sales data but are
     either absent from the KB or named differently there, and without a group they
     vanished from every group filter — which is why Small and Toy looked almost
     empty. Mapped explicitly rather than fuzzy-matched: "German Spitz" is not
     "German Shepherd", and a fuzzy match would have made exactly that mistake. */
  const GROUP_FALLBACK = {
    "Dachshund":"Small",                    // KB has it as "Dachshund (Standard)"
    "Greyhound / Sighthound":"Large",       // KB has "Rampur Greyhound" under Native
    "German Spitz":"Small",
    "Bichon Frise":"Small",
    "Havanese":"Small",
    "Miniature Schnauzer":"Small",
    "Cavalier King Charles Spaniel":"Small",
    "Akita":"Large",
    "Dogo Argentino":"Large",
    "Pointer / Setter":"Large"
  };
  const GROUP_OF = React.useMemo(()=>{
    const m={}; (typeof BREEDS==="undefined"?[]:BREEDS).forEach(b=>{m[b.name]=b.group;});
    Object.keys(GROUP_FALLBACK).forEach(k=>{ if(!m[k]) m[k]=GROUP_FALLBACK[k]; });
    return m;
  },[]);
  const groupList = React.useMemo(()=>{
    const order=["Toy","Small","Medium","Large","Giant","Native"];
    const present=new Set(allBreeds.map(b=>GROUP_OF[b]).filter(Boolean));
    return order.filter(g=>present.has(g)).concat([...present].filter(g=>!order.includes(g)).sort());
  },[allBreeds,GROUP_OF]);
  const breeds = gFilter==="All groups" ? allBreeds : allBreeds.filter(b=>GROUP_OF[b]===gFilter);
  const liveCats = Object.keys(PRODUCT_CHARTS||{});
  const groups = Object.keys(CAT_GROUPS).filter(g=>CAT_GROUPS[g].some(c=>liveCats.includes(c)));
  const subs = (CAT_GROUPS[grp]||[]).filter(c=>liveCats.includes(c));
  const activeSub = subs.includes(sub) ? sub : subs[0];
  const allProds = Object.keys((PRODUCT_CHARTS||{})[activeSub]||{}).sort();

  const card={background:"#fff",borderRadius:10,border:"1px solid #E6E9EF",padding:16,marginBottom:12};
  const sel={padding:"10px 12px",borderRadius:8,border:"1.5px solid #C3C6D4",fontFamily:"inherit",fontSize:13.5,background:"#fff",minWidth:170};
  const pill=(a)=>({padding:"7px 14px",borderRadius:999,border:a?"1.5px solid #FF6D1F":"1.5px solid #E6E9EF",
    background:a?"#FF6D1F":"#fff",color:a?"#fff":"#40434E",fontWeight:600,fontSize:12.5,cursor:"pointer",fontFamily:"inherit"});

  const recRows = (cat,pname)=>{
    const chart=(PRODUCT_CHARTS[cat]||{})[pname]; const R=((PRODUCT_RECS[cat]||{})[pname]||{});
    return Object.keys(R).sort()
      .filter(b=>gFilter==="All groups"||GROUP_OF[b]===gFilter)
      .filter(b=>bFilter==="All breeds"||b===bFilter)
      .map(b=>{
        const [i,j]=R[b]; const info=(REC_SALES[b]||{})[cat]||{};
        return {breed:b,group:GROUP_OF[b]||"",rec:chart.sizes[i],up:chart.sizes[j],i,j,chart,
                b:buildSizes(cat,i,j),
                n:info.n,keep:info.keepRate,conf:info.conf,gap:info.gap};
      });
  };
  // A product with no recommendation for the chosen breed is not shown at all —
  // an empty row reads as "we checked and it does not fit", which is not what it means.
  const prods = allProds
    .filter(p=>!pq.trim()||p.toLowerCase().includes(pq.trim().toLowerCase()))
    .filter(p=>recRows(activeSub,p).length>0);
  const hidden = allProds.length - allProds.filter(p=>recRows(activeSub,p).length>0).length;

  const exportSub = ()=>{
    const head=["Category","Product","Applies to SKU","Breed","Breed group",
      "Lean build","RECOMMENDED — average build","Broad & sturdy build",
      "Measurements of the recommended size",
      "Kept in 12m (category)","Keep rate of the most-kept size % (category)","Confidence",
      "New size needed?","Measurement source"];
    const fmt=d=>Object.entries(d||{}).filter(([,v])=>v!=null&&v!=="").map(([k,v])=>k+" "+v).join("; ");
    const out=[head];
    prods.forEach(p=>{
      const chart=(PRODUCT_CHARTS[activeSub]||{})[p];
      recRows(activeSub,p).forEach(r=>out.push([activeSub,p,(chart.skuNames||[]).join(" | "),r.breed,r.group,
        chart.sizes[r.b.lean],chart.sizes[r.b.average],chart.sizes[r.b.broad],
        fmt(chartDims(chart,r.b.average)),
        r.n==null?"":r.n,r.keep==null?"":r.keep,r.conf||"",r.gap||"no",chart.src]));
    });
    downloadCSV(out,`HUFT_${activeSub.replace(/[^A-Za-z]/g,"")}_breed_recommendations.csv`);
  };

  return (<>
    <section style={{...card,paddingBottom:12}}>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {[["product","📦  By product — every SKU and the breeds it fits"],
          ["breed","🐕  By breed — every category, and where a size is missing"]].map(([m,l])=>(
          <button key={m} onClick={()=>setMode(m)} style={{flex:1,minWidth:230,padding:"12px 10px",borderRadius:9,
            border:mode===m?"1.5px solid #FF6D1F":"1.5px solid #E6E9EF",background:mode===m?"#FEF1E5":"#fff",
            color:mode===m?"#BA4511":"#40434E",fontWeight:600,fontSize:13.5,cursor:"pointer",fontFamily:"inherit"}}>{l}</button>
        ))}
      </div>
    </section>

    {/* ================= 1. BY PRODUCT ================= */}
    {mode==="product" && <>
      <section style={card}>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:10}}>
          <select value={grp} onChange={e=>{setGrp(e.target.value);setSub("");setOpenP("");setPq("");}} style={sel}>
            {groups.map(g=><option key={g} value={g}>{g}</option>)}
          </select>
          <select value={activeSub||""} onChange={e=>{setSub(e.target.value);setOpenP("");setPq("");}} style={sel}>
            {subs.map(c=><option key={c} value={c}>{c} ({Object.keys(PRODUCT_CHARTS[c]).length})</option>)}
          </select>
          <select value={gFilter} onChange={e=>{setGFilter(e.target.value);setBFilter("All breeds");}} style={sel}>
            {["All groups",...groupList].map(g=><option key={g} value={g}>{g==="All groups"?g:g+" breeds"}</option>)}
          </select>
          <select value={breeds.includes(bFilter)?bFilter:"All breeds"} onChange={e=>setBFilter(e.target.value)} style={sel}>
            {["All breeds",...breeds].map(b=><option key={b} value={b}>{b}</option>)}
          </select>
          {allProds.length>10 && <input value={pq} onChange={e=>setPq(e.target.value)} placeholder="search SKU…" style={{...sel,minWidth:150}}/>}
          <button onClick={exportSub} style={{...pill(false),border:"1.5px solid #00A25B",color:"#00753F",fontWeight:700}}>⬇  Download Excel</button>
        </div>
        <div style={{fontSize:12,color:"#676879"}}>
          {prods.length} product{prods.length===1?"":"s"} in {activeSub}
          {gFilter!=="All groups" && <> for {gFilter.toLowerCase()} breeds ({breeds.length})</>}
          {bFilter!=="All breeds" && <> · {bFilter} only</>}
          {hidden>0 && <> · {hidden} hidden with no sales evidence</>}
          {" "}· the download gives you every row shown here.
        </div>
      </section>

      {prods.map(p=>{
        const chart=(PRODUCT_CHARTS[activeSub]||{})[p];
        const rows=recRows(activeSub,p);
        const open=openP===p;
        return (
        <section key={p} style={{...card,padding:0,overflow:"hidden"}}>
          <button onClick={()=>setOpenP(open?"":p)} style={{display:"flex",justifyContent:"space-between",gap:10,
            alignItems:"center",width:"100%",padding:"13px 16px",border:"none",background:open?"#FEF1E5":"#fff",
            cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
            <span>
              <span style={{fontWeight:700,fontSize:14,color:"#323338"}}>{p}</span>
              <span style={{display:"block",fontSize:11.5,color:"#9699A6",marginTop:2}}>
                {chart.sizes.length} sizes: {chart.sizes.join(" · ")}
                {chart.variants>1 && <> · {chart.variants} colours</>} — from {chart.src}
              </span>
            </span>
            <span style={{fontSize:12,color:"#676879",whiteSpace:"nowrap"}}>{rows.length} breeds {open?"▾":"▸"}</span>
          </button>
          {open && <div style={{padding:"0 16px 16px"}}>
            {chart.odooSizes && <div style={{fontSize:11.5,color:"#C58A16",background:"#FEF7ED",
              borderRadius:8,padding:"8px 11px",marginTop:8}}>
              <b>Odoo has a combined size label on this product</b> — the SKU suffix reads{" "}
              {chart.odooSizes.map((z,q)=><span key={q}><b>{z}</b>{q<chart.odooSizes.length-1?", ":""}</span>)}.
              We show {chart.sizes.join(", ")}, because a customer must never be given two sizes at once.
              Worth fixing in the product master so the two agree.
            </div>}
            {(chart.colours||[]).length>0
              ? <div style={{fontSize:11.5,color:"#9699A6",padding:"8px 0"}}>
                  Same size chart across {chart.variants} colours: {chart.colours.join(", ")}
                  {chart.baseSku && <> · SKUs {chart.baseSku}</>}
                </div>
              : (chart.skuNames||[]).length>0 && <div style={{fontSize:11.5,color:"#9699A6",padding:"8px 0"}}>Applies to: {chart.skuNames.join(", ")}</div>}
            <div style={{overflowX:"auto"}}><table style={{borderCollapse:"collapse",fontSize:12.5,width:"100%"}}>
              <thead><tr>{["Breed","Group","Lean build","RECOMMENDED — average build","Broad & sturdy build","Measurements of the recommended size",`Keep rate — all ${activeSub} for this breed`,"New size needed?"].map(h=>
                <th key={h} style={{textAlign:"left",padding:"7px 9px",borderBottom:"1.5px solid #E6E9EF",color:"#676879",fontWeight:600,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
              <tbody>{rows.map(r=>(
                <tr key={r.breed} style={{borderBottom:"1px solid #F2F3F7"}}>
                  <td style={{padding:"7px 9px",fontWeight:600}}>{r.breed}</td>
                  <td style={{padding:"7px 9px",color:"#676879"}}>{r.group}</td>
                  <td style={{padding:"7px 9px",color:"#676879"}}>{r.chart.sizes[r.b.lean]}</td>
                  <td style={{padding:"7px 9px",fontWeight:700,color:"#BA4511"}}>{r.chart.sizes[r.b.average]}</td>
                  <td style={{padding:"7px 9px",color:"#676879"}}>{r.chart.sizes[r.b.broad]}</td>
                  <td style={{...S_MONO,padding:"7px 9px",color:"#676879",fontSize:11.5}}>
                    {Object.entries(chartDims(r.chart,r.b.average)||{}).filter(([,v])=>v!=null&&v!=="").map(([k,v])=>k+" "+v).join(" · ")}</td>
                  <td style={{...S_MONO,padding:"7px 9px",color:keepColour(r.keep),fontWeight:600}}>
                    {r.keep!=null?r.keep+"%":"—"}
                    {r.n!=null && <span style={{color:"#9699A6",fontWeight:400}}> of {r.n.toLocaleString()}</span>}
                  </td>
                  <td style={{padding:"7px 9px",color:r.gap?"#D83A52":"#9699A6"}}>{r.gap||"no"}</td>
                </tr>))}</tbody>
            </table></div>
            {rows.length===0 && <p style={{fontSize:13,color:"#9699A6"}}>No breed has enough sales evidence for this product yet.</p>}
            {gFilter!=="All groups" && rows.length>0 && (()=>{
              const tally={}; rows.forEach(r=>{const z=r.chart.sizes[r.b.average]; tally[z]=(tally[z]||0)+1;});
              const sizes=chart.sizes.filter(z=>tally[z]);
              return (
                <div style={{background:"#F5F6F8",borderRadius:8,padding:"10px 13px",marginTop:10,fontSize:12.5}}>
                  <b>{gFilter} breeds</b> on this product take{" "}
                  {sizes.map((z,q)=>(
                    <span key={z}>
                      <b style={{color:"#BA4511"}}>{z}</b>
                      <span style={{color:"#9699A6"}}> ({tally[z]} breed{tally[z]===1?"":"s"})</span>
                      {q<sizes.length-1?" · ":""}
                    </span>))}
                  {sizes.length===1 && <span style={{color:"#676879"}}> — one size covers the whole group.</span>}
                </div>);
            })()}
            <div style={{fontSize:11,color:"#9699A6",marginTop:8,lineHeight:1.6}}>
              Keep rate is how often that breed kept the size we recommend, across <b>every {activeSub}</b> they bought — not this SKU alone. The sales pull groups by category and size, not by product code, so the figure repeats down the category. Re-pull grouped by base SKU if you need it per product.
            </div>
          </div>}
        </section>);
      })}
      {prods.length===0 && <section style={card}><p style={{margin:0,color:"#9699A6"}}>No product matches “{pq}”.</p></section>}
    </>}

    {/* ================= 2. BY BREED ================= */}
    {mode==="breed" && (()=>{
      const f=BREED_FIT[breed];
      const bySize=REC_SALES[breed]||{};
      const cats=Object.keys(bySize).sort();
      const gaps=cats.filter(c=>bySize[c].gap);
      const exportBreed=()=>{
        const out=[["Breed","Group","Category","Lean build","RECOMMENDED — average build","Broad & sturdy build",
                    "Kept in 12m","Keep rate of the most-kept size %","Confidence","New size needed?"]];
        cats.forEach(c=>{const t=catBuilds(c,bySize[c]); const r=bySize[c];
          out.push([breed,GROUP_OF[breed]||"",c,t.lean,t.average,t.broad,
                    r.n,r.keepRate==null?"":r.keepRate,r.conf,r.gap||"no"]);});
        downloadCSV(out,`HUFT_${breed.replace(/[^A-Za-z]/g,"")}_by_category.csv`);
      };
      return (<>
        <section style={card}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
            <select value={gFilter} onChange={e=>setGFilter(e.target.value)} style={sel}>
              {["All groups",...groupList].map(g=><option key={g} value={g}>{g==="All groups"?g:g+" breeds"}</option>)}
            </select>
            <select value={breeds.includes(breed)?breed:(breeds[0]||"")} onChange={e=>setBreed(e.target.value)} style={{...sel,minWidth:220}}>
              {breeds.map(b=><option key={b} value={b}>{b}</option>)}
            </select>
            <button onClick={exportBreed} style={{...pill(false),border:"1.5px solid #00A25B",color:"#00753F",fontWeight:700}}>⬇  Download Excel</button>
            {onAsk && <button onClick={()=>onAsk(breed)} style={pill(false)}>💬  Ask about {breed}</button>}
          </div>
          {f && <div style={{fontSize:12.5,color:"#676879",marginTop:9}}>
            {f.orders.toLocaleString()} orders · {f.returnPct!=null?f.returnPct+"% returned":"—"} · sizing evidence: {f.lean}
          </div>}
        </section>

        <section style={{...card,borderLeft:gaps.length?"4px solid #D83A52":"4px solid #00A25B"}}>
          <div style={{fontWeight:700,fontSize:14.5,marginBottom:3}}>Do we need a new size for {breed}?</div>
          {gaps.length===0
            ? <p style={{margin:0,fontSize:13,color:"#00753F"}}>No. Across all {cats.length} categories, an existing size is kept often enough that the range works for this breed.</p>
            : <div style={{display:"grid",gap:8,marginTop:6}}>
                {gaps.map(c=>(
                  <div key={c} style={{background:"#FFF5F5",borderRadius:8,padding:"11px 13px"}}>
                    <div style={{fontWeight:700,fontSize:13.5}}>{c} — {bySize[c].gap}</div>
                    <div style={{fontSize:12,color:"#40434E",marginTop:3}}>
                      Best available size is <b>{bySize[c].base}</b>, kept {bySize[c].keepRate}% of the time across {bySize[c].n.toLocaleString()} purchases.
                    </div>
                  </div>))}
              </div>}
          <div style={{fontSize:11.5,color:"#9699A6",marginTop:10,lineHeight:1.6}}>
            Read from what customers kept and returned, not from body measurements. A category is flagged when even the best-performing size comes back too often for the recommendation to fix it.
          </div>
        </section>

        <section style={card}>
          <div style={{fontWeight:700,fontSize:14.5,marginBottom:8}}>Every category — recommended size for {breed}</div>
          <div style={{overflowX:"auto"}}><table style={{borderCollapse:"collapse",fontSize:12.5,width:"100%"}}>
            <thead><tr>{["Category","Lean build","RECOMMENDED — average build","Broad & sturdy build","Keep rate of the most-kept size","Confidence","New size needed?"].map(h=>
              <th key={h} style={{textAlign:"left",padding:"7px 9px",borderBottom:"1.5px solid #E6E9EF",color:"#676879",fontWeight:600,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
            <tbody>{cats.map(c=>{const r=bySize[c]; const t=catBuilds(c,r);
              return (
              <tr key={c} style={{borderBottom:"1px solid #F2F3F7"}}>
                <td style={{padding:"7px 9px",fontWeight:600}}>{c}</td>
                <td style={{padding:"7px 9px",color:"#676879"}}>{t.lean}</td>
                <td style={{padding:"7px 9px",fontWeight:700,color:"#BA4511"}}>{t.average}</td>
                <td style={{padding:"7px 9px",color:"#676879"}}>{t.broad}</td>
                <td style={{...S_MONO,padding:"7px 9px",color:keepColour(r.keepRate),fontWeight:600}}>
                  {r.keepRate!=null?r.keepRate+"%":"—"}
                  <span style={{color:"#9699A6",fontWeight:400}}> of {r.n.toLocaleString()}</span></td>
                <td style={{padding:"7px 9px",color:"#676879"}}>{r.conf}</td>
                <td style={{padding:"7px 9px",color:r.gap?"#D83A52":"#9699A6"}}>{r.gap||"no"}</td>
              </tr>);})}</tbody>
          </table></div>
          <div style={{fontSize:11.5,color:"#9699A6",marginTop:9}}>
            These are category-level sizes. For the size on one specific SKU, switch to <b>By product</b> — collars and harnesses in particular differ from each other.
            <b> On clothing</b>, an average dog takes the larger of the two sizes: 66% of recorded exchanges went UP, and a slightly loose garment still works while a tight one comes back.
            <b> On collars, leashes, harnesses and bandanas</b> an average dog stays on the size customers actually kept — an adjustable band has a hard lower limit, and sizing up a small dog gives them something that will not pull tight enough.
            Keep rate belongs to the size customers bought most, not necessarily to the recommendation.
          </div>
        </section>
      </>);
    })()}
  </>);
}

  const [toast,setToast]=useState("");
  const say=m=>{setToast(m);setTimeout(()=>setToast(""),2500);};

  const persistProducts=l=>{setSaved(l); if(!store.set(KEY_PRODUCTS,l)) say("Storage unavailable — export before closing");};
  const addFeedback=f=>{const l=[...feedback,f]; setFeedback(l); if(store.set(KEY_FEEDBACK,l)) say("Feedback saved — thank you"); else say("Storage unavailable");};
  const addCustomBreed=b=>{const l=[...customBreeds,b]; setCustomBreeds(l); if(store.set(KEY_CUSTOM,l)) say(`"${b.name}" added to database`); else say("Storage unavailable — export before closing"); setShowAddBreed(false);};
  const removeCustomBreed=name=>{ if(!window.confirm(`Remove custom breed "${name}"? This cannot be undone.`)) return; const l=customBreeds.filter(b=>b.name!==name); setCustomBreeds(l); store.set(KEY_CUSTOM,l); say(`Removed "${name}"`);};

  const fitCatOptions = useMemo(()=>["All",...Array.from(new Set(fullCatalog.map(p=>p.category))).sort()],[fullCatalog]);
  const fitSubOptions = useMemo(()=>["All",...Array.from(new Set(fullCatalog.filter(p=>fitCat==="All"||p.category===fitCat).map(p=>p.subCategory))).sort()],[fullCatalog,fitCat]);
  const fitProductOptions = useMemo(()=>fullCatalog.filter(p=>(fitCat==="All"||p.category===fitCat)&&(fitSub==="All"||p.subCategory===fitSub)),[fullCatalog,fitCat,fitSub]);
  // A single catalog size gives one fixed measurement (min===max) — show it as
  // a plain value ("29 cm"), not a zero-width "range" ("29–29 cm").
  const fmtDim=(r)=> r[0]===r[1] ? `${r[0]} cm` : `${r[0]}–${r[1]} cm`;
  const applyDimsFromAgg=(agg,label,name)=>{
    // Never drop attributes a variant carries beyond neck/chest/length (e.g. a
    // leash's own length, a collar's width) — keep them visible as extra context
    // even though they don't feed the breed-fit percentage.
    setFitExtra(agg.extra||[]);
    if(agg.length){
      setNoDims(false);
      setPtype("apparel"); setLengthMin(agg.length[0]); setLengthMax(agg.length[1]);
      setFitNote(`Loaded body length ${fmtDim(agg.length)} ${label}.`);
    } else if(agg.chest){
      setNoDims(false);
      setPtype("harness"); if(agg.neck){setNeckMin(agg.neck[0]);setNeckMax(agg.neck[1]);} setChestMin(agg.chest[0]); setChestMax(agg.chest[1]);
      const parts=[agg.neck?`neck ${fmtDim(agg.neck)}`:null,`chest ${fmtDim(agg.chest)}`].filter(Boolean).join(" & ");
      setFitNote(`Loaded ${parts} ${label}.`);
    } else if(agg.neck){
      setNoDims(false);
      setPtype("collar"); setNeckMin(agg.neck[0]); setNeckMax(agg.neck[1]);
      setFitNote(`Loaded neck ${fmtDim(agg.neck)} ${label}.`);
    } else {
      setNoDims(true);
      const extraList=(agg.extra||[]).map(e=>e.label.toLowerCase()+" "+fmtDim(e.range)).join(", ");
      const extraBit=extraList ? (" It does carry "+extraList+", but that's not a dog-fit measurement.") : "";
      setFitNote(`"${name}" doesn't have structured neck/chest/length measurements to auto-fill.${extraBit} Showing No fit for all breeds until you enter dimensions manually below.`);
    }
  };
  const applyProduct=(name)=>{
    setFitProductName(name);
    if(!name){ setFitVariantSize(""); setFitNote(""); setNoDims(false); setFitExtra([]); return; }
    const p=fullCatalog.find(x=>x.name===name);
    if(!p){ setFitVariantSize(""); setFitNote(""); setNoDims(false); setFitExtra([]); return; }
    // Always default to a specific size — never a combined all-sizes range (that span is not a real product and gives wrong fit info).
    const v=p.variants[0];
    if(v){ setFitVariantSize(v.size); applyDimsFromAgg(aggregateDims(p,v), `for size ${v.size} of "${name}"`, name); }
    else { setFitVariantSize(""); applyDimsFromAgg(aggregateDims(p), `for "${name}"`, name); }
  };
  const applySize=(sizeLabel)=>{
    const p=fullCatalog.find(x=>x.name===fitProductName);
    if(!p) return;
    const v=p.variants.find(x=>x.size===sizeLabel) || p.variants[0];
    if(!v) return;
    setFitVariantSize(v.size);
    applyDimsFromAgg(aggregateDims(p,v), `for size ${v.size} of "${fitProductName}"`, fitProductName);
  };
  const manualEdit=(setter)=>(v)=>{ setter(v); setNoDims(false); };

  // A single catalog size (e.g. "5XL") carries one fixed measurement, not a range —
  // min===max in that case. Allow that (>=) rather than requiring a true range (>).
  const validDims = ptype==="apparel" ? (lengthMin!==""&&lengthMax!==""&&lengthMax>=lengthMin)
    : ptype==="collar" ? (neckMin!==""&&neckMax!==""&&neckMax>=neckMin)
    : (neckMin!==""&&neckMax!==""&&chestMin!==""&&chestMax!==""&&neckMax>=neckMin&&chestMax>=chestMin);

  // overlapPct treats a zero-width range as "no overlap" by design (hi<=lo -> 0),
  // which is right for a genuine range but wrong for one fixed garment measurement —
  // that should instead be checked with a small real-world fit tolerance around it.
  const FIT_PAD=2;
  const padRange=(r)=> (r[0]===r[1] ? [r[0]-FIT_PAD, r[1]+FIT_PAD] : r);

  const results=useMemo(()=>{ if(!validDims) return [];
    if(noDims){
      return ALL.map(b=>({breed:b,nPct:0,cPct:0,combined:0,grade:"none",demand:b.pop})).sort((a,z)=>z.demand-a.demand);
    }
    if(ptype==="apparel"){
      return ALL.map(b=>{ const bodyLen=(b.care&&b.care.bodyLen)||b.height;
        const lPct=overlapPct(bodyLen,padRange([lengthMin,lengthMax]));
        return {breed:b,nPct:lPct,cPct:1,combined:lPct,grade:gradeOf(lPct),demand:b.pop};
      }).sort((a,z)=>z.combined-a.combined||z.demand-a.demand);
    }
    return ALL.map(b=>{ const nPct=overlapPct(b.neck,padRange([neckMin,neckMax]));
      const cPct=ptype==="harness"?overlapPct(b.chest,padRange([chestMin,chestMax])):1;
      const combined=ptype==="harness"?Math.min(nPct,cPct):nPct;
      return {breed:b,nPct,cPct,combined,grade:gradeOf(combined),demand:b.pop};
    }).sort((a,z)=>z.combined-a.combined||z.demand-a.demand);
  },[ptype,neckMin,neckMax,chestMin,chestMax,lengthMin,lengthMax,validDims,noDims,ALL]);

  const counts=useMemo(()=>{const c={full:0,good:0,partial:0,none:0};results.forEach(r=>c[r.grade]++);return c;},[results]);

  const saveProduct=()=>{ if(!validDims) return;
    const p={id:Date.now(),name:pname.trim()||`${ptype==="collar"?"Collar":"Harness"} ${saved.length+1}`,type:ptype,neck:[neckMin,neckMax],chest:ptype==="harness"?[chestMin,chestMax]:null,width};
    persistProducts([...saved,p]); say(`Saved "${p.name}" to line coverage`);
  };
  const removeProduct=id=>persistProducts(saved.filter(p=>p.id!==id));

  const exportJSON=(data,fname)=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; a.click(); URL.revokeObjectURL(a.href);
  };

  const filteredBreeds=ALL.filter(b=>(grp==="All"||b.group===grp)&&b.name.toLowerCase().includes(query.toLowerCase()));
  const searchResults=query.trim()?ALL.filter(b=>b.name.toLowerCase().includes(query.toLowerCase())):[];

  const coverage=useMemo(()=>ALL.map(b=>{
    let best={grade:"none",pct:0,via:null};
    saved.forEach(p=>{ const nPct=overlapPct(b.neck,p.neck);
      const cPct=p.type==="harness"&&p.chest?overlapPct(b.chest,p.chest):1;
      const combined=p.type==="harness"?Math.min(nPct,cPct):nPct;
      if(combined>best.pct) best={grade:gradeOf(combined),pct:combined,via:p.name};
    });
    return {breed:b,...best};
  }).sort((a,z)=>a.pct-z.pct),[saved,ALL]);
  const gaps=coverage.filter(c=>c.grade==="none"||c.grade==="partial");

  // Knowledge base is deliberately not in the nav — it is still reachable by
  // typing a breed into the search bar, which is how anyone who needs it gets there.
  const NAVITEMS=[["home","⌂","Home"],["fit","📏","Check a fit"],["catalog","📚","HUFT Catalog"],["feedback","📝","Feedback"]];
  const card={background:"#fff",borderRadius:8,border:"1px solid #E6E9EF",padding:16,marginBottom:12};

  return (
    <div className="app-shell" style={{background:"#F6F7FB",color:"#323338",fontFamily:"'Rubik', -apple-system, 'Segoe UI', sans-serif"}}>
      {/* monday-style left sidebar */}
      <aside className="side">
        <div onClick={()=>setTab("home")} style={{cursor:"pointer",display:"flex",alignItems:"center",gap:9,flexShrink:0}}>
          <div style={{background:"#FF6D1F",color:"#fff",borderRadius:8,width:38,height:38,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:15}}>H</div>
          <div><div style={{fontWeight:700,fontSize:14.5,lineHeight:1.1,color:"#222222"}}>HUFT</div><div style={{fontSize:10.5,color:"#676879",letterSpacing:"0.08em"}}>FIT FINDER</div></div>
        </div>
        <div className="navlist">
          {NAVITEMS.map(([k,ic,l])=>{
            const badge = k==="feedback"?feedback.length : 0;
            return (
            <button key={k} onClick={()=>setTab(k)} style={{display:"flex",alignItems:"center",gap:9,padding:"8px 10px",borderRadius:6,border:"none",cursor:"pointer",fontSize:13.5,fontWeight:tab===k?600:500,fontFamily:"inherit",whiteSpace:"nowrap",textAlign:"left",background:tab===k?"#FEF1E5":"transparent",color:tab===k?"#BA4511":"#40434E",boxShadow:tab===k?"inset 3px 0 0 #FF6D1F":"none"}}>
              <span style={{fontSize:15,width:20,textAlign:"center"}}>{ic}</span>{l}
              {badge>0 && <span style={{marginLeft:"auto",background:tab===k?"#FF6D1F":"#E6E9EF",color:tab===k?"#fff":"#676879",borderRadius:999,fontSize:10.5,fontWeight:700,padding:"1px 7px"}}>{badge}</span>}
            </button>);
          })}
        </div>
        <div className="sidestats" style={{borderTop:"1px solid #EAECF2",paddingTop:10,fontSize:11,color:"#9699A6",lineHeight:1.7}}>
          {ALL.length} breeds · all cm<br/>{customBreeds.length} team-added<br/>v5.0 · real sales data
          {onLogout && <button onClick={onLogout} style={{marginTop:8,border:"1px solid #E6E9EF",background:"#fff",color:"#676879",borderRadius:7,padding:"5px 10px",fontSize:11,cursor:"pointer",fontFamily:"inherit",width:"100%"}}>Log out</button>}
        </div>
      </aside>

      <div className="mainarea">
      {/* topbar with global search */}
      <div style={{background:"#fff",borderBottom:"1px solid #E6E9EF",padding:"10px 16px",position:"sticky",top:0,zIndex:30}}>
        <div style={{maxWidth:960,margin:"0 auto",position:"relative"}}>
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder={`Search ${ALL.length} breeds — Indie, Labrador, Mudhol…`}
            style={{width:"100%",boxSizing:"border-box",padding:"10px 16px",borderRadius:8,border:"1.5px solid #E6E9EF",fontSize:14,fontFamily:"inherit",background:"#F6F7FB",color:"#323338"}}/>
          {query.trim() && tab!=="library" && (
            <div style={{position:"absolute",top:"100%",left:0,right:0,background:"#fff",borderRadius:8,marginTop:6,boxShadow:"0 10px 30px rgba(50,51,56,0.18)",border:"1px solid #E6E9EF",zIndex:40,overflow:"hidden"}}>
              {searchResults.slice(0,6).map(b=>(
                <button key={b.name} onClick={()=>{setTab("library");setGrp("All");}} style={{display:"flex",justifyContent:"space-between",gap:8,width:"100%",padding:"10px 14px",border:"none",borderBottom:"1px solid #EAECF2",background:"#fff",cursor:"pointer",fontFamily:"inherit",fontSize:13.5,color:"#323338",textAlign:"left"}}>
                  <b>{b.name}</b><span style={{...MONO,fontSize:11.5,color:"#9699A6"}}>neck {b.neck[0]}–{b.neck[1]} · chest {b.chest[0]}–{b.chest[1]}</span>
                </button>
              ))}
              {searchResults.length===0 && <div style={{padding:"10px 14px",fontSize:13,color:"#9699A6"}}>No breed matches "{query}"</div>}
            </div>
          )}
        </div>
      </div>

      <div style={{maxWidth:960,margin:"0 auto",padding:"16px 16px 60px"}}>
        {toast && <div style={{position:"fixed",bottom:18,left:"50%",transform:"translateX(-50%)",background:"#323338",color:"#fff",padding:"10px 16px",borderRadius:999,fontSize:13,zIndex:50}}>{toast}</div>}

        {/* ===== HOME ===== */}
        {tab==="home" && <>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(240px, 1fr))",gap:12,marginBottom:12}}>
            {[["fit","📏","Check a fit","What a customer sees. Breed, product, build — then the size."],["catalog","📚","HUFT Catalog","Every SKU and the breeds it fits, or every breed and where a size is missing"]].map(([k,ic,t,d])=>(
              <button key={k} onClick={()=>setTab(k)} style={{textAlign:"left",background:"#fff",border:"1.5px solid #E6E9EF",borderRadius:8,padding:"16px 14px",cursor:"pointer",fontFamily:"inherit"}}>
                <div style={{fontSize:26}}>{ic}</div>
                <div style={{fontWeight:700,fontSize:14.5,color:"#323338",margin:"6px 0 3px"}}>{t}</div>
                <div style={{fontSize:12,color:"#676879",lineHeight:1.45}}>{d}</div>
              </button>
            ))}
          </div>
          <section style={card}>
            <h3 style={{margin:"0 0 4px",fontSize:14.5}}>HUFT priority breeds</h3>
            <p style={{fontSize:12,color:"#676879",margin:"0 0 10px"}}>The six breeds with dedicated HUFT shop-by-breed pages — check these first on any new product.</p>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {ALL.filter(b=>b.huft).map(b=>(
                <button key={b.name} onClick={()=>{setQuery(b.name);setTab("library");}} style={{padding:"7px 14px",borderRadius:999,border:"1.5px solid #FF6D1F",background:"#fff",color:"#FF6D1F",fontWeight:600,fontSize:12.5,cursor:"pointer",fontFamily:"inherit"}}>{b.name}</button>
              ))}
            </div>
          </section>
        </>}


        {/* ===== CHECK A FIT — customer flow ===== */}
        {tab==="fit" && <CheckFitTab/>}
        {tab==="library" && <>
          <section style={card}>
            <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:2,alignItems:"center"}}>
              <button onClick={()=>setShowAddBreed(!showAddBreed)} style={{padding:"5px 14px",borderRadius:999,fontSize:12.5,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit",border:"1.5px solid #FF6D1F",background:showAddBreed?"#FF6D1F":"#fff",color:showAddBreed?"#fff":"#FF6D1F"}}>+ Add breed</button>
              {GROUPS.map(g=>(
                <button key={g} onClick={()=>setGrp(g)} style={{padding:"5px 12px",borderRadius:999,fontSize:12.5,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit",border:grp===g?"1.5px solid #323338":"1.5px solid #E6E9EF",background:grp===g?"#323338":"#fff",color:grp===g?"#F6C445":"#676879"}}>{g}</button>
              ))}
            </div>
            <div style={{display:"flex",gap:6,paddingTop:8,alignItems:"center"}}>
              <span style={{fontSize:11.5,color:"#9699A6"}}>{(typeof SALES!=="undefined"?ALL.filter(b=>SALES[b.name]&&SALES[b.name].ok).length:0)} sales-verified · rest confirmed by knowledge base only</span>
            </div>
            {query.trim() && <div style={{fontSize:12,color:"#676879",marginTop:8}}>Filtering by search: "{query}" — clear the top bar to see all.</div>}
          </section>
          {showAddBreed && <AddBreedForm existingNames={ALL.map(b=>b.name)} onAdd={addCustomBreed} onClose={()=>setShowAddBreed(false)}/>}
          {filteredBreeds.map(b=><BreedCard key={b.name} b={b} feedback={feedback} onAddFeedback={addFeedback} onDelete={b.custom?removeCustomBreed:null} defaultOpen={filteredBreeds.length===1}/>)}
          {filteredBreeds.length===0 && <p style={{textAlign:"center",color:"#9699A6"}}>No breeds match — clear the search or pick another group.</p>}
        </>}

        {/* ===== HUFT CATALOG (Odoo export + curated fit-matched SKUs + team additions) ===== */}
        {tab==="catalog" && <FitCatalogTab
          onAsk={(b)=>{setAskOpen(true);setTimeout(()=>{window.__ASK_PREFILL__&&window.__ASK_PREFILL__(`Which products and sizes fit a ${b}?`);},60);}}/>}

        {/* ===== FEEDBACK LOG ===== */}
        {tab==="feedback" && <>
          <section style={card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
              <h3 style={{margin:0,fontSize:15}}>Team feedback on breed data ({feedback.length})</h3>
              {feedback.length>0 && <button onClick={()=>exportJSON(feedback,"huft-fit-feedback.json")} style={{border:"1px solid #C3C6D4",background:"#fff",borderRadius:7,padding:"5px 12px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:600,color:"#565A6E"}}>Export JSON</button>}
            </div>
            <p style={{fontSize:12.5,color:"#676879",margin:"6px 0 0"}}>Every rating submitted from the Knowledge base appears here. Export and share the JSON to consolidate team review — this is the pipeline for upgrading C-tier estimates to A-tier fit-lab data.</p>
          </section>
          {feedback.length===0 ? (
            <section style={{...card,textAlign:"center",padding:36}}>
              <div style={{fontSize:34}}>📝</div>
              <h3 style={{margin:"8px 0 4px"}}>No feedback yet</h3>
              <p style={{color:"#676879",fontSize:13.5,margin:0}}>Open any breed in the library and tap "Rate this data" to log whether the numbers match reality.</p>
            </section>
          ) : [...feedback].reverse().map(f=>(
            <div key={f.id} style={{...card,padding:"12px 14px",borderLeft:`4px solid ${f.verdict==="good"?"#00A25B":"#E2445C"}`}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:8,flexWrap:"wrap",fontSize:13}}>
                <span><b>{f.breed}</b> · {f.field} · <span style={{color:f.verdict==="good"?"#00A25B":"#E2445C",fontWeight:700}}>{f.verdict==="good"?"✓ good":"✗ needs fix"}</span></span>
                <span style={{...MONO,fontSize:11.5,color:"#9699A6"}}>{f.author} · {f.ts.slice(0,16).replace("T"," ")}</span>
              </div>
              {f.text && <p style={{margin:"6px 0 0",fontSize:13,color:"#40434E"}}>{f.text}</p>}
            </div>
          ))}
        </>}

        <footer style={{marginTop:20,fontSize:11.5,color:"#9699A6",lineHeight:1.6}}>
          <b>Sizes</b> come from what customers actually kept — {FIT_META.orders.toLocaleString()} orders and {FIT_META.returns.toLocaleString()} returns over {FIT_META.window}, store and online. They are not calculated from body measurements.
          <b> Measurements</b> come from two places: the size charts in the product decks (apparel), and the product dimensions held in Odoo (collars, leashes, harnesses, jackets, dresses, bandanas). Every size chart says which. The Odoo ones have not been checked against a physical product yet.
          <b> Confidence tiers</b> in the Knowledge base — <b>A</b>: published standard or measured study (±2–3 cm) · <b>B</b>: aggregated manufacturer sizing charts (±4–6 cm) · <b>C</b>: estimated from build, pending HUFT fit-lab measurement (±8 cm+). Team-added breeds and feedback are stored in this browser only; export JSON to consolidate.
        </footer>
      </div>
      </div>
      <AskWidget open={askOpen} onToggle={()=>setAskOpen(o=>!o)} all={ALL}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate/>);

   products: id, name, type, neck_min/max, chest_min/max, width)
   and lift setState into .then() — the rest of the app is
   storage-agnostic.
   ============================================================ */
</script>
</body>
</html>
